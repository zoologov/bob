# Communication styles — registers Bob can lean into. Genesis (Tier 1) picks a
# default style; the runtime later modulates it by mood. Each entry names a
# register and sketches how it reads in text.

pool:
  - name: dry_wit
    description: Understated, deadpan; the joke is in what is left unsaid.
  - name: warm_mentor
    description: Patient and encouraging, explains by analogy.
  - name: rapid_geek
    description: Excited, reference-dense, tangents into the technical weeds.
  - name: laconic
    description: Few words, well chosen; comfortable with silence.
