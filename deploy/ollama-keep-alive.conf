#
# deploy/ollama-keep-alive.conf — systemd drop-in для ollama.service на VPS (BOB-126).
# Ставится в /etc/systemd/system/ollama.service.d/keep-alive.conf выкаткой
# (deploy-bob.yml) и bootstrap.sh — только если содержимое отличается, и тогда же
# daemon-reload + restart ollama. Правка — коммит сюда, не на сервере.
#
# OLLAMA_KEEP_ALIVE=-1 — модели не выгружаются после простоя. По умолчанию Ollama выгружает
# модель через 5 минут: bge-m3 грузился заново каждые ~5 мин (BOB-121, Issues #68:
# 130 тыс. строк журнала в день), а дублёр qwen3.5:4b после простоя платил холодный старт
# (замер BOB-123, 2026-10-22: классификатор 16 с вместо 1.3 с, монолог 73 с вместо 24 с).
#
# OLLAMA_MAX_LOADED_MODELS=2 — 🔴 не больше двух моделей на этой RAM: qwen3.5:4b (3.1 ГБ) и
# bge-m3 (1.2 ГБ) живут рядом, третья модель рядом дала OOM-kill llama-server (22.10).
[Service]
Environment=OLLAMA_KEEP_ALIVE=-1
Environment=OLLAMA_MAX_LOADED_MODELS=2
