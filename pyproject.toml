[tool.ruff.lint.isort]
known-first-party = ["bob"]

# --- MyPy ---

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
# Exclude frozen/non-product trees (godot = frozen FLUX visual track; build artifacts)
exclude = [
    "^godot/",
    "^build/",
    "^dist/",
]

[[tool.mypy.overrides]]
module = ["ultralytics.*", "open_clip.*", "mlx_audio.*", "faiss.*", "sentence_transformers.*", "sqlite_vec.*"]
ignore_missing_imports = true

# --- Pytest ---

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# CI safety net (BOB-009): a default per-test timeout so a future busy-loop (e.g. a
# typing keepalive driven by a non-yielding fake sleep) FAILS FAST instead of
# hanging the suite/CI for minutes. ``thread`` works without signals/async magic.
timeout = 60
timeout_method = "thread"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[dependency-groups]
dev = [
    "mutmut>=3.2",
    "pytest-bdd>=8.1",
    "pytest-timeout>=2.4.0",
]

# --- Mutation testing (BOB-066 Срез 0) ---
# Mutation is a DELIBERATE, per-slice run on the touched PURE DOMAIN core — NOT a
# pre-commit/pre-push hook (too slow; see scripts/mutation.sh + dev-docs/MUTATION.md).
# Convention: mutation-score ≥85% on the affected domain module; equivalent mutants are
# triaged explicitly (never pad the number). Target = deterministic verdict/policy/threshold
# logic ONLY. Adapters / ports / LLM / async / gateway / infrastructure are OUT of scope
# (slow, non-deterministic, uninformative) — kept out by scanning only the business-domain
# packages below and denying their impure sub-trees.
[tool.mutmut]
# Scan the pure business-domain packages (technical layers — application/infrastructure/
# runtime/kernel — are excluded by simply not being listed). Per-slice runs narrow to a
# single module via a mutant-name filter (e.g. `scripts/mutation.sh bob.social.sulk`).
source_paths = [
    "src/bob/conversation",
    "src/bob/social",
    "src/bob/personality",
    "src/bob/memory",
    "src/bob/proactivity",
    "src/bob/coding",
    # BOB-087.E (bob-6u2): живой терминал стал своим bounded context, и его чистые ядра
    # (argv_policy / intent / resume_policy / resume_negotiation) уехали вместе с ним —
    # пакет обязан остаться под мутацией, иначе гейт этих ядер молча исчез бы вместе с
    # переездом (ровно тот фиктивный гейт, против которого написан MUTATION.md).
    "src/bob/interactive",
