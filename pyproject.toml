[tool.ruff.lint.isort]
known-first-party = ["bob"]

# --- MyPy ---

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
# Exclude frozen/non-product trees (godot = frozen FLUX visual track; build artifacts)
exclude = [
    "^godot/",
    "^build/",
    "^dist/",
]

[[tool.mypy.overrides]]
module = ["ultralytics.*", "open_clip.*", "mlx_audio.*", "faiss.*", "sentence_transformers.*", "sqlite_vec.*"]
ignore_missing_imports = true

# --- Pytest ---

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# CI safety net (BOB-009): a default per-test timeout so a future busy-loop (e.g. a
# typing keepalive driven by a non-yielding fake sleep) FAILS FAST instead of
# hanging the suite/CI for minutes. ``thread`` works without signals/async magic.
timeout = 60
timeout_method = "thread"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]
