[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bob"
version = "0.1.0"
description = "Bob — Telegram-native autonomous companion agent inspired by 'We Are Legion (We Are Bob)'"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-BUSL-1.1 AND Apache-2.0 AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "LICENSE-APACHE.md", "LICENSE-CC-BY-NC-SA.md"]
authors = [{ name = "v.zoologov" }]

# Core runtime — P0 "Личность в Telegram" (text MVP). See .claude/dev-docs/VISION.md §7.
dependencies = [
    "aiogram>=3.29",               # Telegram transport (Bot API 10.1: rich/stream/thinking) — Bob's "body"
    "aiohttp>=3.11",               # async HTTP client — Ollama API (Qwen 7B/0.5B)
    "aiosqlite>=0.21",             # SQLite — structured state & memory (FTS5, no RAG/embeddings in P0)
    "pydantic>=2.10",              # domain models (Mood/Taste/Negotiation/SOUL)
    "pyyaml>=6.0",                 # layered config + bob-soul templates
    "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
# embeddings/RAG — deferred to P1.5+ (P0 uses SQLite FTS5 keyword recall, no vectors)
embeddings = [
    "sentence-transformers>=3.3",
    "faiss-cpu>=1.9",
]
# --- frozen tracks (see VISION.md §6): unfreeze on demand ---
visual = [                         # FLUX image generation ("облик") — P1; uses mflux (uv tool), not a dep here
    "torch>=2.5",
    "transformers>=4.47",
]
voice = [                          # FROZEN: STT/TTS (MLX Whisper + Qwen3-TTS) on Apple Silicon
    "mlx-audio>=0.1",
]
vision = [                         # FROZEN: camera/CV (hardware track)
    "ultralytics>=8.3",            # YOLO
    "opencv-python-headless>=4.10",
    "open-clip-torch>=2.29",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.15",
    "mypy>=1.19",
    "pre-commit>=4.0",
    "types-PyYAML>=6.0",
]
all = ["bob[embeddings,visual,voice,vision,dev]"]

[tool.hatch.build.targets.wheel]
packages = ["src/bob"]

# --- Ruff ---

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific
    "PT",     # flake8-pytest-style
    "S",      # flake8-bandit (security)
    "ARG",    # flake8-unused-arguments
    "PL",     # pylint
]
ignore = [
    "PLR0913",  # too many arguments — domain models may need them
    "S101",     # assert in tests is fine
]

[tool.ruff.lint.per-file-ignores]
# The persona voice module (BOB-016) is, by nature, multi-line Russian prose
# whose Cyrillic look-alikes are intentional (the model reads the directives
# natively); RUF001's ambiguous-character lint does not apply to these literals.
"src/bob/domain/personality/voice.py" = ["RUF001"]
"tests/**/*.py" = ["S101", "ARG001", "PLR2004"]
# The expression decider (BOB-018) seeds `random.Random` for deterministic
# stochastic-sampling assertions (the non-crypto PRNG is the point → S311) and
# uses short Russian inbound literals/comments whose Cyrillic look-alikes are
# intentional (→ RUF001/RUF003).
"tests/domain/personality/test_expression.py" = [
    "S101",
    "ARG001",
    "PLR2004",
    "S311",
    "RUF001",
    "RUF003",
]
# HandleMessage tests (BOB-018 врезка) seed `random.Random` for deterministic
# expression-plan assertions (non-crypto PRNG → S311) and use short Russian
# inbound literals/comments with intentional Cyrillic look-alikes (RUF001/RUF003).
"tests/application/usecases/test_handle_message.py" = [
    "S101",
    "ARG001",
    "PLR2004",
    "S311",
    "RUF001",
    "RUF003",
]
# Proactivity tests seed `random.Random` for deterministic stochastic-sampling
# assertions; the non-crypto PRNG is the point here, so S311 does not apply.
"tests/domain/proactivity/*.py" = ["S101", "ARG001", "PLR2004", "S311"]
"tests/application/proactivity/*.py" = ["S101", "ARG001", "PLR2004", "S311"]
# The proactivity integration e2e seeds `random.Random` to find a deterministic
# firing seed; the non-crypto PRNG is the point, so S311 does not apply.
"tests/test_e2e_proactivity.py" = ["S101", "ARG001", "PLR2004", "S311"]
# The FakeEmbedder seeds `random.Random` from a text hash to produce stable
# pseudo-vectors for tests; the non-crypto PRNG is the point, so S311 does not apply.
"tests/support/*.py" = ["S101", "ARG001", "PLR2004", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["bob"]

# --- MyPy ---

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
# Exclude frozen/non-product trees (godot = frozen FLUX visual track; build artifacts)
exclude = [
    "^godot/",
    "^build/",
    "^dist/",
]

[[tool.mypy.overrides]]
module = ["ultralytics.*", "open_clip.*", "mlx_audio.*", "faiss.*", "sentence_transformers.*", "sqlite_vec.*"]
ignore_missing_imports = true

# --- Pytest ---

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# CI safety net (BOB-009): a default per-test timeout so a future busy-loop (e.g. a
# typing keepalive driven by a non-yielding fake sleep) FAILS FAST instead of
# hanging the suite/CI for minutes. ``thread`` works without signals/async magic.
timeout = 60
timeout_method = "thread"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]
