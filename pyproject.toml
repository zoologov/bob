[tool.ruff.lint.isort]
known-first-party = ["bob"]

# --- MyPy ---

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
# Exclude frozen/non-product trees (godot = frozen FLUX visual track; build artifacts)
exclude = [
    "^godot/",
    "^build/",
    "^dist/",
]

[[tool.mypy.overrides]]
module = ["ultralytics.*", "open_clip.*", "mlx_audio.*", "faiss.*", "sentence_transformers.*", "sqlite_vec.*"]
ignore_missing_imports = true

# --- Pytest ---

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# CI safety net (BOB-009): a default per-test timeout so a future busy-loop (e.g. a
# typing keepalive driven by a non-yielding fake sleep) FAILS FAST instead of
# hanging the suite/CI for minutes. ``thread`` works without signals/async magic.
timeout = 60
timeout_method = "thread"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[dependency-groups]
dev = [
    "mutmut>=3.2",
    "pytest-bdd>=8.1",
    "pytest-timeout>=2.4.0",
]

# --- Mutation testing (BOB-066 Срез 0) ---
# Mutation is a DELIBERATE, per-slice run on the touched PURE DOMAIN core — NOT a
# pre-commit/pre-push hook (too slow; see scripts/mutation.sh + dev-docs/MUTATION.md).
# Convention: mutation-score ≥85% on the affected domain module; equivalent mutants are
# triaged explicitly (never pad the number). Target = deterministic verdict/policy/threshold
# logic ONLY. Adapters / ports / LLM / async / gateway / infrastructure are OUT of scope
# (slow, non-deterministic, uninformative) — kept out by scanning only the business-domain
# packages below and denying their impure sub-trees.
[tool.mutmut]
# Scan the pure business-domain packages (technical layers — application/infrastructure/
# runtime/kernel — are excluded by simply not being listed). Per-slice runs narrow to a
# single module via a mutant-name filter (e.g. `scripts/mutation.sh bob.social.sulk`).
source_paths = [
    "src/bob/conversation",
    "src/bob/social",
    "src/bob/personality",
    "src/bob/memory",
    "src/bob/proactivity",
    "src/bob/coding",
    "src/bob/capabilities",
    # BOB-066 Срез 2.3: the presence ритм-слой is pure domain — its policies
    # (share_of_voice / natural_delay / reaction_budget) are exactly the deterministic
    # threshold logic mutation measures. The episodic adapter is denied below.
    "src/bob/presence",
    # BOB-066 Срез 2.1: the intake-развязка lives in application/runtime, but its
    # debounce/scope DECISION core (``decisions.py``) is exactly the pure, deterministic
    # verdict logic mutation exists to measure — so it is scanned here, while the async
    # orchestration around it (inbox/dispatcher/scope/focus) is denied below.
    "src/bob/application/runtime/intake",
]
# Deny the impure sub-trees inside those packages: adapters (I/O), ports (protocols),
# and package __init__ re-exports carry no deterministic verdict logic to mutate.
do_not_mutate = [
    "*/adapters/*",
    "*/ports.py",
    "*/__init__.py",
    # Intake (BOB-066 2.1): only the pure ``decisions.py`` carries deterministic verdict
    # logic; the async orchestration (buffer/worker/scope/focus) is impure → out of scope.
    "*/intake/inbox.py",
    "*/intake/dispatcher.py",
    "*/intake/scope.py",
    "*/intake/focus.py",
]
# Mutation measures the strength of the pure-domain UNIT tests (tests/domain/) — fast and
# deterministic — NOT the slow async e2e/integration suite. Selecting them here keeps the
# one-time coverage-stats phase cheap so a per-slice run stays quick.
pytest_add_cli_args_test_selection = ["tests/domain"]
# The kernel (ports/protocols the domain tests import) is NOT mutated but IS imported by
# tests/domain — copy it + the package root verbatim into the mutants sandbox so the
# (non-mutated) tests still collect and run.
also_copy = [
    "src/bob/__init__.py",
    "src/bob/py.typed",
    "src/bob/kernel",
]
