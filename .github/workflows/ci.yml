name: CI

# BOB-095: настоящий гейт по PR. На ветке Боба pre-push хук не исполняется (BOB-089),
# поэтому быстрый гейт на его коммитах исчез — CI по PR возвращает автоматику.
#
# 🔴 ДВА РАЗНЫХ СМЫСЛА СЛОВА «БЛОКИРУЮЩИЙ» — не путать:
#  1. Внутри прогона: шаг валит прогон (нет continue-on-error). Таковы ВСЕ шаги ниже,
#     включая config-check (с BOB-112). С BOB-108 сюда снова входит и beadloom-гейт.
#  2. На мёрже: required status check. Такого здесь НЕТ и быть не может — branch
#     protection на этом плане недоступна (403 Upgrade to Pro). Красный виден в PR и
#     мёржу не мешает. Называть CI «required» — то же желаемое-за-действующее, что
#     правили в BOB-089.
# То есть CI — ИНФОРМАТИВНЫЙ по отношению к мёржу, но внутри себя честный.
#
# 🔴 BOB-108: beadloom-шаг стоял под continue-on-error из-за сегфолта `reindex`, и потому
# арх-границы и свежесть доков в CI не проверялись ВООБЩЕ, а прогон читался зелёным
# (класс §0.3: гейт умеет показывать зелёное, ничего не проверив). Сегфолт устранён пином
# tree-sitter, гейт снова кусачий. config-check был вынесен с названной причиной (PyPI 2.1.0
# отставал от main beadloom) и условием окончания — оно наступило с релизом 9.0.0, и BOB-112
# вернул шаг в гейт. См. CLAUDE.md §6 + .claude/development/docs/features/BOB-112/BRIEF.md.
#
# 🔴 BOB-112: beadloom пинится ТОЧНОЙ версией. Плавающий `uv tool install beadloom` означал,
# что гейт менялся датой установки, а не коммитом: между 2.1.0 и 9.0.0 семь мажоров, и на
# нетронутом графе 9.0.0 давал lint exit 1 / sync-check exit 2 — никто бы не узнал, какой
# именно прогон это принёс. Бамп версии — осознанный коммит (с замером на чистом индексе).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Единственный источник пина beadloom для этого workflow: из него ставится бинарь, и с
      # ним сверяется гард tests/test_ci_runs_real_tool_tests.py — тот проверяет, что тесты на
      # реальном бинаре во время pytest видят ИМЕННО эту сборку (BOB-112.6).
      BEADLOOM_VERSION: "9.0.0"
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история (BOB-112.12): тест реального бинаря
          # test_a_graph_changing_diff_exits_nonzero_and_still_answers гоняет `beadloom diff
          # --since 66aa620~1`, и на мелком checkout (depth 1) он молча уходил в SKIP на каждом
          # прогоне (виден в логе run 32232968676). С полной историей он помечен real_beadloom,
          # и его SKIP на раннере — FAILED (BOB_REQUIRE_REAL_BEADLOOM=1 на шаге Pytest).
          fetch-depth: 0

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync deps
        # 🔴 --extra dev: ruff/mypy/pytest живут в [project.optional-dependencies].dev,
        # дефолтный `uv sync` их не ставит (урок деплоя v1.0.0, Issues #57).
        run: uv sync --extra dev

      - name: Install beadloom (пин версии — BOB-112)
        # Та же сборка, что на VPS (deploy-bob.yml) и локально для артефактов
        # (`uvx --from beadloom==9.0.0`). Прежний ручной пин `tree-sitter<0.26` (BOB-108,
        # BDL-UX #150) снят: метаданные beadloom 9.0.0 сами требуют `tree-sitter>=0.25,<0.26`
        # (проверено по importlib.metadata для 9.0.0; другие версии не проверялись, и бамп
        # BEADLOOM_VERSION должен перепроверить это заново).
        # 🔴 Стоит ДО Pytest (BOB-112.6): около тридцати тестов интроспекции/диаграмм/здоровья
        # инструментов гоняют НАСТОЯЩИЙ бинарь и без него на PATH дают SKIP. Когда установка
        # шла после Pytest, все они на раннере молча пропускались (замер ревью: 331 passed /
        # 37 skipped против 368/368 с 9.0.0 на PATH), и формат `why`/`diff` закреплённой
        # сборки CI не проверял вовсе.
        run: uv tool install "beadloom==${BEADLOOM_VERSION}"

      - name: Beadloom index (чистый) для тестов на реальном бинаре
        # Индекс в gitignore и с кодом не приезжает; без него те же тесты пропускаются как
        # «repo not indexed». Чистый — по той же причине, что в гейте ниже (§0.3 п.1).
        run: |
          rm -f .beadloom/beadloom.db
          beadloom reindex

      - name: Ruff
        run: uv run ruff check src/ tests/

      - name: Mypy (src)
        run: uv run mypy src/

      - name: Mypy (tests)
        run: uv run mypy tests/

      - name: Pytest
        # 🔴 -rs: печатает ПРИЧИНУ пропусков. Процессный гейт test_process_drift_gate на
        # раннере (нет bd/базы трекера — Dolt gitignored) даёт SKIP с причиной, не ERROR и
        # не молчаливое зелёное (BOB-098). Так CI не читается как «согласованность проверена».
        # Тесты на реальном beadloom здесь ИСПОЛНЯЮТСЯ: бинарь и индекс поставлены выше, а
        # гард test_ci_runs_real_tool_tests краснеет, если на этом шаге нет бинаря, индекса
        # или бинарь не той версии, что BEADLOOM_VERSION.
        # 🔴 BOB-112.11: гард выше проверяет лишь ПРЕДУСЛОВИЯ (бинарь, индекс, версия), и
        # ревью его обмануло: 9.0.0 на PATH за обёрткой, у которой `why` выходит с rc 1, —
        # гард зелёный, тест `why` ушёл в SKIP. ИСХОД держит BOB_REQUIRE_REAL_BEADLOOM=1:
        # SKIP любого теста с маркером real_beadloom здесь становится FAILED с исходной
        # причиной (tests/support/real_beadloom_requirement.py). Тесты, которым кроме beadloom
        # нужен mmdc, bd или старый коммит (checkout мелкий), маркера не несут.
        # -p no:randomly: детерминированный порядок (воспроизводимость CI).
        env:
          BOB_REQUIRE_REAL_BEADLOOM: "1"
        run: uv run pytest -q -rs -p no:randomly

      - name: Beadloom Gate (beadloom ci, чистый индекс) — БЛОКИРУЮЩИЙ
        # 🔴 ЧИСТЫЙ индекс: инкрементальный reindex НЕ обновляет рёбра импортов и врёт
        # (§0.3 п.1, BDL-UX #142). Сносим БД индекса, `beadloom ci` пересобирает её с нуля
        # первым шагом (а заодно отбрасывает всё, что мог оставить в индексе pytest).
        # 🔴 BOB-112.6: гейт — ОДНА команда `beadloom ci`, та же, что pre-push хук и что
        # координатор гоняет руками на финальном дереве. Прежде здесь стояли шесть подкоманд
        # по отдельности, и проверки, которые `beadloom ci` добавляет сверх них, в CI не шли:
        # «в CI тот же гейт, что локально» было неправдой. Видимость по подкомандам не
        # теряется — `--format github` (явно, а не по угадыванию TTY): каждый шаг называет
        # свой PASS/WARN/FAIL/SKIP строкой ::notice, находки становятся аннотациями.
        # Что добавилось к вердикту, замерено на 9.0.0: docs-quality, doc-spaces и scope-check
        # проходят безусловно (поставлены как warn), issue-log и readme-pair здесь SKIP (не
        # объявлены), поэтому блокирует то же, что блокировали шесть подкоманд, — на дереве
        # BOB-112 оба варианта дали exit 0. scope-check на pull_request даёт SKIP с причиной:
        # checkout PR — detached merge-коммит, ветки, называющей работу, у него нет.
        # Прежде весь шаг стоял под continue-on-error из-за сегфолта reindex, то есть
        # арх-границы и свежесть доков в CI не проверялись ВООБЩЕ, а прогон читался зелёным
        # (класс §0.3). Снято в BOB-108; кусачесть доказана саботажем границы — правило
        # `capabilities-usecases-no-adapters` назвалось с файлом и строкой, exit 1.
        # config-check (часть `beadloom ci`) в гейте с BOB-112: релиз 9.0.0 несёт шаблоны
        # BDL-059, рукописная методология живёт в проектном слое `.beadloom/flow/`, манифест
        # в git — дрейф теперь означает дрейф, а не отставание PyPI.
        run: |
          rm -f .beadloom/beadloom.db
          beadloom ci --format github
