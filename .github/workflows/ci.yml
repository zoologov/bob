name: CI

# BOB-095: настоящий гейт по PR. На ветке Боба pre-push хук не исполняется (BOB-089),
# поэтому быстрый гейт на его коммитах исчез — CI по PR возвращает автоматику.
#
# 🔴 ДВА РАЗНЫХ СМЫСЛА СЛОВА «БЛОКИРУЮЩИЙ» — не путать:
#  1. Внутри прогона: шаг валит прогон (нет continue-on-error). Таковы ВСЕ шаги ниже,
#     кроме config-check. С BOB-108 сюда снова входит и beadloom-гейт.
#  2. На мёрже: required status check. Такого здесь НЕТ и быть не может — branch
#     protection на этом плане недоступна (403 Upgrade to Pro). Красный виден в PR и
#     мёржу не мешает. Называть CI «required» — то же желаемое-за-действующее, что
#     правили в BOB-089.
# То есть CI — ИНФОРМАТИВНЫЙ по отношению к мёржу, но внутри себя честный.
#
# 🔴 BOB-108: beadloom-шаг стоял под continue-on-error из-за сегфолта `reindex`, и потому
# арх-границы и свежесть доков в CI не проверялись ВООБЩЕ, а прогон читался зелёным
# (класс §0.3: гейт умеет показывать зелёное, ничего не проверив). Сегфолт устранён пином
# tree-sitter, гейт снова кусачий. Вынесен только config-check — с названной причиной.
# См. CLAUDE.md §6 + .claude/development/docs/features/BOB-108/BRIEF.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync deps
        # 🔴 --extra dev: ruff/mypy/pytest живут в [project.optional-dependencies].dev,
        # дефолтный `uv sync` их не ставит (урок деплоя v1.0.0, Issues #57).
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src/ tests/

      - name: Mypy (src)
        run: uv run mypy src/

      - name: Mypy (tests)
        run: uv run mypy tests/

      - name: Pytest
        # 🔴 -rs: печатает ПРИЧИНУ пропусков. Процессный гейт test_process_drift_gate на
        # раннере (нет bd/базы трекера — Dolt gitignored) даёт SKIP с причиной, не ERROR и
        # не молчаливое зелёное (BOB-098). Так CI не читается как «согласованность проверена».
        # -p no:randomly: детерминированный порядок (воспроизводимость CI).
        run: uv run pytest -q -rs -p no:randomly

      - name: Install beadloom
        # 🔴 tree-sitter пинится ЯВНО. beadloom требует `tree-sitter>=0.23` без верхней
        # границы, а грамматики (`tree-sitter-python` 0.25.0) собраны под ABI 0.25 — свежая
        # установка тянет ядро 0.26.0 и `beadloom reindex` умирает нативно, БЕЗ ВЫВОДА
        # (SIGSEGV 139 на раннере, SIGBUS 138 на macOS). Отсюда прежнее «локально работает,
        # на раннере падает»: дело не в раннере, а в дате установки. BOB-108, BDL-UX #150.
        run: uv tool install beadloom --with "tree-sitter<0.26"

      - name: Beadloom Gate (чистый индекс) — БЛОКИРУЮЩИЙ
        # 🔴 ЧИСТЫЙ индекс: инкрементальный reindex НЕ обновляет рёбра импортов и врёт
        # (§0.3 п.1, BDL-UX #142). Сносим БД индекса и пересобираем с нуля.
        # Это `beadloom ci` МИНУС `config-check` — по шагам, чтобы красное называло себя само.
        # Прежде весь шаг стоял под continue-on-error из-за сегфолта выше, то есть
        # арх-границы и свежесть доков в CI не проверялись ВООБЩЕ, а прогон читался зелёным
        # (класс §0.3). Снято в BOB-108; кусачесть доказана саботажем границы — правило
        # `capabilities-usecases-no-adapters` назвалось с файлом и строкой, exit 1.
        run: |
          rm -f .beadloom/beadloom.db
          beadloom reindex
          beadloom lint --strict
          beadloom sync-check
          beadloom docs audit
          beadloom doctor

      - name: Beadloom config-check (ИНФОРМАТИВНЫЙ — причина названа, есть условие окончания)
        # 🔴 Единственная проверка `beadloom ci`, красная НЕ из-за состояния этого репозитория,
        # и потому ВЫНЕСЕНА, а не выключена: красное видно, но не гасит пять проверок выше.
        #
        # ПРИЧИНА — рассинхрон релиза beadloom, а не дрейф наших файлов. Cohesion-параграф
        # (`agents/{dev,review}.md`) и раздел автономии (`commands/coordinator.md`) вкодифицированы
        # в САМИ шаблоны ролей beadloom (BDL-059). Они есть в `main` beadloom, но опубликованный
        # на PyPI 2.1.0 их не содержит — версию не бампили. Отсюда расхождение сред:
        #   локально beadloom стоит ИЗ ИСХОДНИКА  → шаблоны совпадают → config-check exit 0
        #   в CI    `uv tool install beadloom`    → PyPI 2.1.0        → 3 drifted, exit 1
        # 🔴 И потому `--fix` здесь РАЗРУШИТЕЛЕН: он привёл бы файлы к СТАРЫМ шаблонам —
        # 42 удаления, 0 добавлений, включая стоячую методологию CLAUDE.md §0.2.
        #
        # 🔴 УСЛОВИЕ ОКОНЧАНИЯ (у отключённой проверки обязано быть — урок Issues #59):
        # как выйдет релиз beadloom, содержащий BDL-059, шаг возвращается в блокирующий гейт
        # выше. Проверяется одной командой: `beadloom config-check` в CI даёт exit 0.
        # Апстриму заведено: BDL-UX #151 (релиз) + #152 (проектного оверлея нет вовсе —
        # структурная причина, по которой методологию пришлось нести в сам beadloom).
        continue-on-error: true
        run: beadloom config-check
