name: Deploy Bob to VPS

# 🔴 BOB-110: выкатка ставит и BEADLOOM — read-only интроспекция Боба (BOB-091) шеллит
# внешний бинарь, которого в проде НЕ БЫЛО: на «покажи архитектуру» он пять раз подряд
# получил ENOENT. Три условия, и все три проверяются от лица СЕРВИСНОГО пользователя, а не
# root (на каждом из них инцидент мог бы повториться):
#   1. бинарь стоит — но в общесистемный UV_TOOL_DIR, а НЕ в /root/.local/share: симлинк из
#      /usr/local/bin туда пользователь bob не разыменует (домашний каталог root закрыт),
#      и `which beadloom` у него молча не находит ничего;
#   2. версия пинится ТОЧНО (`beadloom==9.0.0`, BOB-112) — та же сборка, что в ci.yml: гейт
#      и интроспекция Боба меняются коммитом, а не датой установки. Прежний пин
#      `tree-sitter<0.26` (BOB-108: нативный сегфолт без вывода) снят — метаданные
#      beadloom 9.0.0 требуют `tree-sitter>=0.25,<0.26` сами (проверено по
#      importlib.metadata для 9.0.0; другие версии не проверялись, и бамп пина должен
#      перепроверить это заново);
#   3. `beadloom reindex` — индекс `.beadloom/beadloom.db` в gitignore и НЕ приезжает с кодом,
#      без него `graph` отвечает «database not found». Гоняется ПОСЛЕ checkout, чтобы индекс
#      соответствовал выкаченному коду, и от имени bob, чтобы файл принадлежал ему.
#
# BOB-094: выкатка Боба на VPS по ТЕГУ (не на каждый мёрж — рестарт живого Боба
# идёт осознанным релизом). Доступ по SSH-КЛЮЧУ (пароль на VPS отключён). Секреты —
# в GitHub Environment `bob-vps`, в лог не печатаются (маскируются GitHub'ом).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Тег/ref для выкатки (по умолчанию — текущий)"
        required: false

concurrency:
  # одна выкатка за раз — не рестартовать Боба параллельно
  group: deploy-bob
  cancel-in-progress: false

jobs:
  gate:
    # 🔴 Быстрый гейт ДО выкатки, чтобы «задеплоил сломанное» не стало новым классом.
    # Полный CI по PR — отдельно (BOB-095).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync deps
        # 🔴 --extra dev: ruff/mypy/pytest живут в [project.optional-dependencies].dev,
        # дефолтный `uv sync` их НЕ ставит (только [dependency-groups].dev) — гейт падал.
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check src/ tests/
      - name: Mypy
        run: uv run mypy src/

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: bob-vps
    steps:
      - name: Set up SSH (key + known_hosts из секретов)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy & restart on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_REF: ${{ github.event.inputs.ref || github.ref_name }}
        # 🔴 BOB-116 D8b: Боб перезапускается только ПОСЛЕ того, как конфигурация прода
        # доказала, что собирается с НАСТОЯЩИМ /opt/bob/.env. Порядок на сервере:
        #   код (fetch/checkout/uv sync)
        #   -> 1/4 предусловие: в .env есть все обязательные переменные (иначе — миграция,
        #      deploy/RUNBOOK.md §9)
        #   -> 2/4 config/bob.vps.yaml собирается лоадером Боба с этим .env и полон
        #   -> 3/4 копия в config/bob.yaml + sha256 обоих в лог и сравнение
        #   -> keep-alive Ollama (BOB-126): drop-in deploy/ollama-keep-alive.conf ставится,
        #      только если отличается от поставленного, и тогда daemon-reload + restart ollama;
        #      ДО pull — иначе рестарт выгрузил бы только что загруженную модель
        #   -> 4/4 дублёр Tier-0: модель тянется, только если ДЕЙСТВУЮЩАЯ конфигурация его
        #      включает (решает тот же understudy_endpoint, что и фабрика провайдеров)
        #   -> beadloom (BOB-110)
        #   -> юнит bob (BOB-126): deploy/bob.service ставится, только если отличается, и
        #      тогда daemon-reload — до рестарта, чтобы рестарт поднял Боба с новым юнитом
        #   -> restart.
        # Без изменений файлы не трогаются: рестарт Ollama на каждой выкатке выгружал бы обе
        # модели, и первая дверь после релиза платила бы холодную загрузку.
        # Проверка идёт ДО копирования, а не после: отказ оставляет действующий
        # config/bob.yaml нетронутым, и упавший сам по себе Боб поднимется на прежнем;
        # равенство sha переносит вердикт проверки на скопированный файл.
        # .env выкатка не пишет никогда. Значения из него в лог не попадают: проверки
        # печатают имена переменных и пути настроек (deploy/check_config.py).
        # Поведение шага держит tests/deploy/test_deploy_workflow.py — он ИСПОЛНЯЕТ этот
        # скрипт с заглушками вместо сервера. BOB_HOME/UV_BIN/UV_TOOLS/UV_TOOL_BINS/SYSTEMD_DIR
        # переопределяет только тест: по ssh окружение не передаётся, действуют пути прода.
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o IdentitiesOnly=yes "${VPS_USER}@${VPS_HOST}" \
              "bash -s -- $(printf '%q' "${DEPLOY_REF}")" <<'REMOTE'
          set -euo pipefail
          # Тело — функция, вызванная со stdin из /dev/null. Bash читает этот скрипт из stdin
          # ssh, и команда, которая сама читает stdin, съела бы его хвост. А оборванная
          # передача не исполнит половину выкатки: функция исполняется, только прочитанная
          # целиком.
          step() { printf '==> %s\n' "$*"; }
          fail() { printf '❌ %s\n' "$*" >&2; exit 1; }

          deploy() {
            local DEPLOY_REF="$1"
            BOB_HOME="${BOB_HOME:-/opt/bob}"
            UV_BIN="${UV_BIN:-/usr/local/bin/uv}"
            UV_TOOLS="${UV_TOOLS:-/usr/local/share/uv-tools}"
            UV_TOOL_BINS="${UV_TOOL_BINS:-/usr/local/bin}"
            SYSTEMD_DIR="${SYSTEMD_DIR:-/etc/systemd/system}"
            PY="$BOB_HOME/.venv/bin/python"
            CHECK="$BOB_HOME/deploy/check_config.py"
            TRACKED="$BOB_HOME/config/bob.vps.yaml"
            LIVE="$BOB_HOME/config/bob.yaml"
            ENV_FILE="$BOB_HOME/.env"
            KEEP_ALIVE_SRC="$BOB_HOME/deploy/ollama-keep-alive.conf"
            KEEP_ALIVE="$SYSTEMD_DIR/ollama.service.d/keep-alive.conf"
            UNIT_SRC="$BOB_HOME/deploy/bob.service"
            UNIT="$SYSTEMD_DIR/bob.service"
            OLLAMA_READY_TRIES=30  # секунд ждать Ollama после её рестарта

            # git/uv и проверки — от пользователя bob (владелец /opt/bob и .env 600);
            # копия конфига, ollama и restart — от root.
            step "код: ${DEPLOY_REF}"
            sudo -u bob git -C "$BOB_HOME" fetch --tags --prune
            # BOB-125: имя ВЕТКИ берётся из origin, а не из локальной ветки VPS — fetch её не
            # двигает, и `checkout main` дважды (22.10) выкатил старый код. Тег и SHA — как прежде.
            if sudo -u bob git -C "$BOB_HOME" show-ref --verify --quiet "refs/remotes/origin/${DEPLOY_REF}"; then
              sudo -u bob git -C "$BOB_HOME" checkout -B "$DEPLOY_REF" "origin/${DEPLOY_REF}"
            else
              sudo -u bob git -C "$BOB_HOME" checkout "$DEPLOY_REF"
            fi
            echo "код на диске: $(sudo -u bob git -C "$BOB_HOME" rev-parse --short HEAD)"
            sudo -u bob bash -lc "cd '$BOB_HOME' && '$UV_BIN' sync"

            step "1/4 предусловие: в .env есть все обязательные переменные"
            sudo -u bob "$PY" "$CHECK" require-env --env-file "$ENV_FILE" \
              || fail "мигрируй идентификаторы в .env — deploy/RUNBOOK.md §9. Боб не перезапущен."

            step "2/4 config/bob.vps.yaml собирается с настоящим .env"
            sudo -u bob "$PY" "$CHECK" validate --config "$TRACKED" --env-file "$ENV_FILE" \
              || fail "конфигурация не собирается: config/bob.yaml не тронут, Боб не перезапущен."

            step "3/4 действующий конфиг = репозиторий"
            install -o bob -g bob -m 0640 "$TRACKED" "$LIVE"
            sha256sum "$TRACKED" "$LIVE"
            [ "$(sha256sum < "$TRACKED")" = "$(sha256sum < "$LIVE")" ] \
              || fail "sha256 config/bob.yaml не равен config/bob.vps.yaml. Боб не перезапущен."

            # install — вне условия if: внутри него set -e не остановил бы выкатку на отказе.
            step "keep-alive Ollama: модели в памяти, не больше двух (BOB-126)"
            if cmp -s "$KEEP_ALIVE_SRC" "$KEEP_ALIVE"; then
              echo "keep-alive: без изменений"
            else
              install -D -m 0644 "$KEEP_ALIVE_SRC" "$KEEP_ALIVE"
              systemctl daemon-reload
              systemctl restart ollama \
                || fail "keep-alive поставлен, а Ollama не перезапустилась. Боб не перезапущен."
              # systemctl возвращается, когда процесс запущен, а не когда он слушает порт:
              # pull сразу после рестарта ушёл бы в закрытый порт.
              local tries=0
              until ollama ps >/dev/null 2>&1; do
                tries=$((tries + 1))
                [ "$tries" -lt "$OLLAMA_READY_TRIES" ] \
                  || fail "Ollama не ответила за ${OLLAMA_READY_TRIES} с после рестарта. Боб не перезапущен."
                sleep 1
              done
              echo "keep-alive: поставлен, Ollama перезапущена и отвечает"
            fi

            step "4/4 дублёр Tier-0"
            local model
            model="$(sudo -u bob "$PY" "$CHECK" understudy-model \
              --config "$LIVE" --env-file "$ENV_FILE")"
            if [ -z "$model" ]; then
              echo "дублёр выключен в конфиге — модель не тянем"
            else
              ollama pull "$model" || fail "ollama pull ${model} не прошёл. Боб не перезапущен."
              # awk читает список целиком: grep -q под pipefail ронял бы конвейер SIGPIPE.
              ollama list | awk -v m="$model" \
                'NR > 1 && ($1 == m || $1 == m ":latest") { found = 1 } END { exit !found }' \
                || fail "модели ${model} нет в ollama list после pull. Боб не перезапущен."
              echo "модель дублёра на месте: ${model}"
            fi

            step "beadloom 9.0.0 для интроспекции Боба (BOB-110)"
            UV_TOOL_DIR="$UV_TOOLS" UV_TOOL_BIN_DIR="$UV_TOOL_BINS" \
              "$UV_BIN" tool install --force beadloom==9.0.0
            chmod -R a+rX "$UV_TOOLS"
            sudo -u bob bash -lc "cd '$BOB_HOME' && beadloom reindex"

            step "юнит bob (BOB-126)"
            if cmp -s "$UNIT_SRC" "$UNIT"; then
              echo "unit bob: без изменений"
            else
              install -D -m 0644 "$UNIT_SRC" "$UNIT"
              systemctl daemon-reload
              echo "unit bob: поставлен, systemd перечитал юниты"
            fi

            step "рестарт"
            systemctl restart bob
            sleep 5
            systemctl is-active bob
          }

          deploy "$@" </dev/null
          REMOTE
      - name: Note
        run: echo "Выкачен ${DEPLOY_REF:-tag} на VPS. Полный старт Боба ~1 мин (прогрев эмбеддера); при restart_notice=true Боб сам скажет в личку и группу, что обновился."
        env:
          DEPLOY_REF: ${{ github.event.inputs.ref || github.ref_name }}
