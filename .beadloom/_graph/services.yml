  # ── Declarative Clean-Architecture layer dependencies ───────────────────────
  # (Fine-grained depends_on between submodules is derived from real imports by
  #  the import resolver — not duplicated here.)
  - src: bob-application
    dst: bob-domain
    kind: depends_on
  - src: bob-infrastructure
    dst: bob-application
    kind: depends_on
  - src: bob-infrastructure
    dst: bob-domain
    kind: depends_on
  - src: runtime
    dst: bob-domain
    kind: depends_on
  - src: runtime
    dst: bob-application
    kind: depends_on
  - src: runtime
    dst: bob-infrastructure
    kind: depends_on
