  # ── Root service self-reference (satisfies service-needs-parent convention) ─
  - src: bob
    dst: bob
    kind: part_of

  # ── Layers part_of the service ──────────────────────────────────────────────
  - src: runtime
    dst: bob
    kind: part_of
  - src: bob-domain
    dst: bob
    kind: part_of
  - src: bob-application
    dst: bob
    kind: part_of
  - src: bob-infrastructure
    dst: bob
    kind: part_of

  # ── Domain submodules part_of the domain layer ──────────────────────────────
  - src: ports
    dst: bob-domain
    kind: part_of
  - src: personality
    dst: bob-domain
    kind: part_of
  - src: memory
    dst: bob-domain
    kind: part_of
  - src: goals
    dst: bob-domain
    kind: part_of
  - src: coding
    dst: bob-domain
    kind: part_of
  - src: diagrams-domain
    dst: bob-domain
    kind: part_of
  - src: introspection-domain
    dst: bob-domain
    kind: part_of
  - src: permission
    dst: bob-domain
    kind: part_of
  - src: proactivity-domain
    dst: bob-domain
    kind: part_of

  # ── Application submodules part_of the application layer ─────────────────────
  - src: usecases
    dst: bob-application
    kind: part_of
  - src: authz
    dst: bob-application
    kind: part_of
  - src: capabilities-app
    dst: bob-application
    kind: part_of
  - src: router
    dst: bob-application
    kind: part_of
  - src: runtime-app
    dst: bob-application
    kind: part_of
