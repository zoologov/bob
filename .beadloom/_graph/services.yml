# Bob architecture graph — BOB-065 Часть B (detailed graph).
#
# Hierarchy: service `bob` → layers (domain / application / infrastructure +
# runtime composition root) → submodule nodes on REAL current paths. Layer is
# expressed as a tag on the node (the engine keys layer rules off tags, not code
# markers). Files map to the DEEPEST node whose `source:` prefix contains them
# (import_resolver._find_node_for_file), so the 186 blanket `# beadloom:domain=bob`
# headers stay inert — they resolve to ref_id `domain:bob` (no such node) and fall
# through to source-prefix matching; no mass re-annotation is required.
#
# NOTE (Фаза 3 / BOB-062 boundary): submodule `source:` paths describe the CURRENT
# layered layout. When the code physically moves to domain-first verticals, only
# the `source:` values are retargeted — ref_ids, kinds, tags and the layer nodes
# survive the reorg.

nodes:
  # ── Root service ────────────────────────────────────────────────────────────
  - ref_id: bob
    kind: service
    source: src/bob/
    tags: [layer-runtime]
    summary: 'Bob — Telegram-native companion agent: GUPPI process, LLM Tier 0/1 router with privacy redaction, SQLite+FTS5 memory, Higher Mind, Genesis, heartbeat. Two admin bots in one process (BOB-003): a MultiBotGateway (BotRegistry) polls both Bob and GUPPI, dedups cross-bot by (chat_id, message_id), and a central router dispatches by identity+scope — Bob lives in his forum topic, GUPPI is the gatekeeper in General with a visible unauthorized reject + owner commands. aiogram transport (native draft streaming + Rich Messages), owner/allowlist/chat-scope authz, resilient ticks, and a capability seam (registry + tool-loop) executed by GUPPI.'
    docs:
      - architecture.md

  # ── Runtime composition root ────────────────────────────────────────────────
  # BOB-062.7a: the composition root physically moved from the single `app.py`
  # (2819 lines) into the `src/bob/runtime/` PACKAGE (composition.py + main.py +
  # clock.py + config.py + wiring/*). `source:` now covers the package so all 14
  # runtime modules resolve here (module-coverage). `app.py` shrank to an 82-line
  # re-export SHIM — it falls through to the `bob` root node (src/bob/). This is
  # the composition-root/entrypoint LAYER (tag `layer-runtime`), NOT a business
  # module-vertical, so it may legitimately import EVERY layer + every module. 🔴
  # Distinct from `bob.application.runtime` (async primitives — the `runtime-app`
  # node, src/bob/application/runtime/); the two never resolve to each other.
  - ref_id: runtime
    kind: service
    source: src/bob/runtime/
    tags: [layer-runtime]
    summary: 'Composition root (`src/bob/runtime/` package + the thin `app.py` shim) — the only layer allowed to wire all layers + all vertical modules at once: `config.py` loads layered config (incl. `_REPO_ROOT`), `wiring/*` build infrastructure adapters + compose application policy/use-cases per bounded context, `composition.py` (`build_application` + `Application`) subscribes handlers to the EventBus and registers ticks + Telegram polling, `clock.py` provides `SystemClock`, and `main.py` runs Genesis once and starts the process.'
    docs:
      - services/runtime.md

  # ── Layer: Domain ───────────────────────────────────────────────────────────
  # BOB-062.8: the layer-first `src/bob/domain/` folder was removed (its only
  # remaining content, the ports re-export shim, was deleted). This node stays the
  # domain-LAYER umbrella (expressed by the `layer-domain` tag); its part_of
  # children are the seven module-vertical bounded contexts plus the shared
  # `kernel`. Its `source:` now anchors on `src/bob/kernel/` (the shared kernel);
  # kernel files resolve to the deeper `kernel` feature node via their
  # `# beadloom:feature=kernel` annotation.
  - ref_id: bob-domain
    kind: domain
    source: src/bob/kernel/
    tags: [layer-domain]
    summary: 'Domain layer umbrella: the seven module-vertical bounded contexts (personality, conversation, memory, proactivity, coding, capabilities, social) plus the shared `kernel` (infra-neutral cross-module contracts). Pure logic + Protocol definitions; no I/O, no LLM, no transport.'
    docs:
      - domains/domain/README.md

  # ── Layer: Application ──────────────────────────────────────────────────────
  - ref_id: bob-application
    kind: domain
    source: src/bob/application/
    tags: [layer-application]
    summary: 'GUPPI orchestration: AgentRuntime + AsyncEventBus, LLMRouter (tier routing + privacy redaction), use-cases (HandleMessage, RunGenesis, UpdateMoodFromText), resilient heartbeat ticks (retry/backoff), the Authorizer access policy and the capability seam (CapabilityRegistry + ToolLoop + recall_memory). Depends on domain via ports; never imports infrastructure.'
    docs:
      - domains/application/README.md

  # ── Layer: Infrastructure ───────────────────────────────────────────────────
  - ref_id: bob-infrastructure
    kind: domain
    source: src/bob/infrastructure/
    tags: [layer-infra]
    summary: 'Port adapters: aiogram Telegram gateway (long-polling + authz gate, native draft streaming, Rich Messages, markdown<->RichMessage, topic-thread reply pinning), MultiBotGateway (BotRegistry + cross-bot dedup + central identity/scope router) and the GuppiHandler gatekeeper (visible reject + owner commands), OpenAI-compatible LLM provider (Tier 0/1 + tool-calling), SQLite+FTS5 persistence, KvAllowlistStore and SoulStore, two-bot layered config loader.'
    docs:
      - domains/infrastructure/README.md

  # ── Shared kernel (kind: feature, part_of bob-domain) ───────────────────────
  # BOB-062.8: the transitive `domain/ports/` re-export shim was deleted and the 7
  # infra-neutral kernel contracts (Clock/EventBus/EventHandler/DomainEvent/
  # LLMProvider/LLMMessage/JsonValue) moved to `src/bob/kernel/` — a classical DDD
  # SHARED KERNEL: cross-module contracts every vertical may import (inward-safe, no
  # cycles); the kernel imports from no module. The per-module ports (`<module>/
  # ports.py`) resolve to their own module-vertical nodes. With this move the last
  # layer-first `src/bob/domain/` folder is gone.
  - ref_id: kernel
    kind: feature
    source: src/bob/kernel/
    tags: [layer-domain]
    summary: 'Shared kernel — the infra-neutral contracts every vertical module rests on: the runtime seams (Clock, EventBus, EventHandler, DomainEvent, LLMProvider) and the shared value objects (LLMMessage, JsonValue). Pure Protocol/type definitions; no I/O. Every module may import from here; the kernel imports from no module.'
    docs:
      - domains/domain/features/kernel/SPEC.md

  - ref_id: personality
    kind: feature
    source: src/bob/personality/
    # BOB-062.6a: domain-first VERTICAL module — spans domain+application+infra
    # INSIDE one bounded context, so it is NOT a horizontal layer. Tag is the
    # non-layer `module-vertical` (like `memory` / `proactivity` / `coding` /
    # `capabilities` / `social`) so the tag-based `architecture-layers` rule
    # silently skips its edges; the module's INTERNAL layering and its OUTER
    # boundary are enforced by the path-glob `forbid_import` rules in
    # .beadloom/_graph/rules.yml (§ vertical modules; the personality/conversation
    # rules land in BOB-062.6a .3). Consolidates the former `personality`
    # (domain/personality) layer node — «who Bob is» (mood, taste, disposition,
    # fascination, negotiation, expression, voice, reaction-meaning, reflection).
    # `negotiation` + `reaction_judgment` live here (character stance / emotional
    # response). The Verbosity/EngagementLevel expression vocabulary moved in from
    # conversation (.1) so `voice` no longer reaches out — personality is the
    # stable kernel and NEVER imports conversation. `domain/ports/` keeps a thin
    # re-export shim for the personality ports.
    tags: [module-vertical]
    summary: 'Personality module («who Bob is») — the full character vertical in one place: `ports.py` + pure domain (Mood five-axis affect, TasteEngine + evolution, disposition, fascination + phantoms, language/profanity, expression incl. verbosity/engagement vocabulary, voice, the reaction family, negotiation stance, reflection, absence), `usecases/` (update mood from text, apply/reappraise/parse reflection, evolve fascination/phantoms), and `adapters/` (Tier-0 reaction judge + SQLite/kv fascination & notable-reaction stores). Domain-first slice BOB-062.6a. (Being-received reaction perception is a cross-domain use-case over mood + relationship, so it lives in `application/usecases/perceive_reaction`, not here.)'
    docs:
      - domains/personality/README.md

  - ref_id: conversation
    kind: feature
    source: src/bob/conversation/
    # BOB-062.6a: domain-first VERTICAL module — spans domain+application+infra
    # INSIDE one bounded context, so it is NOT a horizontal layer. Tag is the
    # non-layer `module-vertical` (like `personality` / `social`) so the tag-based
    # `architecture-layers` rule silently skips its edges; the module's INTERNAL
    # layering and its OUTER boundary are enforced by the path-glob `forbid_import`
    # rules in .beadloom/_graph/rules.yml (§ vertical modules; the rules land in
    # BOB-062.6a .3). New «how a turn is conducted» context split out of
    # domain/personality: addressivity, conversation floor & continuity, brevity &
    # engagement (returning personality expression VOs), the zone classifier (+ the
    # ZoneClassifier port, moved here from personality ports), interim lines,
    # response choice, and the response/volatility judgments. Depends on
    # `personality` ONE-DIRECTIONALLY (a turn asks the character how to speak); the
    # `voice↔brevity/engagement` cycle was broken in .1 by moving the expression
    # vocabulary into personality. `domain/ports/` keeps a thin re-export shim.
    tags: [module-vertical]
    summary: 'Conversation module («how a turn is conducted») — the full turn-conduct vertical in one place: `ports.py` (conversation-floor store, closer log, ZoneClassifier) + pure domain (addressivity, conversation + floor continuity, brevity, engagement, zone classifier, interim line, response choice, response/volatility judgments), `usecases/` (decide_response), and `adapters/` (Tier-0 response/volatility/interim judges + SQLite conversation-floor & closer-log stores). Depends on personality one-directionally. Domain-first slice BOB-062.6a.'
    docs:
      - domains/conversation/README.md

  - ref_id: memory
    kind: feature
    source: src/bob/memory/
    # BOB-062.2: domain-first VERTICAL module — spans domain+application+infra
    # INSIDE one bounded context, so it is NOT a horizontal layer. Tag is the
    # non-layer `module-vertical` (like `coding`) so the tag-based
    # `architecture-layers` rule silently skips its edges; the module's INTERNAL
    # layering and its OUTER boundary are enforced by the path-glob `forbid_import`
    # rules in .beadloom/_graph/rules.yml (§ vertical modules, added in .2).
    # NB: the durable episode/fact store (`SqliteMemoryRepo`) now lives HERE in
    # `memory/adapters/sqlite_memory_repo.py` (BOB-062.7b split); it reads the shared
    # `SqliteConnection` kernel OUTWARD (adapter → infrastructure/persistence), and
    # owns EpisodicEvent/SemanticFact internally — the old `kernel → memory` edge is
    # gone (see the note block in rules.yml).
    tags: [module-vertical]
    summary: 'Memory module («Bob remembers») — the full vertical capability in one place: `ports.py` + pure `entities`, `usecases/` (extract facts, consolidate, dedup), and `adapters/` (FTS5/hybrid recall + local Ollama embedder/reranker). Domain-first slice BOB-062.2.'
    docs:
      - domains/memory/README.md

  - ref_id: proactivity
    kind: feature
    source: src/bob/proactivity/
    # BOB-062.3: domain-first VERTICAL module — spans domain+application+infra
    # INSIDE one bounded context, so it is NOT a horizontal layer. Tag is the
    # non-layer `module-vertical` (like `memory` / `coding`) so the tag-based
    # `architecture-layers` rule silently skips its edges; the module's INTERNAL
    # layering and its OUTER boundary are enforced by the path-glob `forbid_import`
    # rules in .beadloom/_graph/rules.yml (§ vertical modules, extended in .2).
    # Consolidates the former `proactivity-domain` + `proactivity-app` + `goals`
    # nodes: drive-model, goals, and self-improvement are ONE «Bob's background
    # life» capability. `self_improvement.py` moved in from `personality`
    # (metacognition over behaviour, BOB-028, not a personality trait). The 4
    # durable stores consume the shared persistence kernel via the injected
    # `SqliteConnection` seam (the connection-kernel split out in BOB-062.7b).
    tags: [module-vertical]
    summary: 'Proactivity module («Bob''s background life») — the full vertical capability in one place: `ports.py` + pure domain (drive-model urge/governance/social-energy, goals graph, self-improvement rules), `usecases/` (engine/tick, plan/pursue goals, detect-patterns/announce-rules), and `adapters/` (proactivity/goal/self-improvement stores + live read-seams). Domain-first slice BOB-062.3.'
    docs:
      - domains/proactivity/README.md

  - ref_id: coding
    kind: feature
    source: src/bob/coding/
    # BOB-062.1: domain-first VERTICAL module — spans domain+application+infra
    # INSIDE one bounded context, so it is NOT a horizontal layer. Tag is the
    # non-layer `module-vertical` (deliberately not `layer-*`) so the tag-based
    # `architecture-layers` rule silently skips its edges; the module's INTERNAL
    # layering and its OUTER boundary are enforced instead by the path-glob
    # `forbid_import` rules in .beadloom/_graph/rules.yml (§ vertical modules).
    # Rationale: as a single node it cannot satisfy the layers rule — `ports`
    # (domain) re-exports `coding` (needs coding ≤ domain) while `coding` uses the
    # shared `router` (needs coding ≥ application); contradictory for one layer tag.
    # BOB-087.E (bob-6u2): the LIVE INTERACTIVE TERMINAL left this node for its own
    # bounded context (`interactive`). What stays here is the GATED coder («план →
    # апрув → PR») plus the SHARED session surface both contexts rest on: `ports.py`,
    # `entities.py` (CodingSession + CodingOutcome), `state.py`, `naming.py`,
    # `sandbox_policy.py` (incl. the ClaudeRunError refusal), `push_guard.py`,
    # `stream_json.py` + `stream_render.py`, and the git-worktree / session-store /
    # one-shot-runner adapters. `coding` does NOT import `interactive` — the edge is
    # one-directional (see the note block in rules.yml).
    tags: [module-vertical]
    summary: 'Coding module («Bob writes code») — the GATED vertical (plan → approve → PR) plus the shared coding-session surface: `ports.py` + pure domain logic (state/naming/sandbox+push policy/stream-json), `usecases/` orchestration, and `adapters/` (Claude Code CLI, git worktree, gh PR, session store, indicator). Domain-first slice BOB-062.1; the live terminal split out into `interactive` in BOB-087.E.'
    docs:
      - domains/coding/README.md

  - ref_id: interactive
    kind: feature
    source: src/bob/interactive/
    # BOB-087.E (bob-6u2): the SECOND bounded context of «Боб пишет код» — the LIVE
    # bidirectional terminal (open / feed / stop / resume a long-lived `claude` in the
    # owner's DM). It was born inside `coding` and grew there until that node hit the
    # `no-monster-modules` ceiling; the fix is not a bigger budget but an honest
    # boundary: the gated coder and the live terminal share a WORKPLACE (worktree /
    # session row / runner transport), not a language — one speaks план/апрув/PR, the
    # other сеанс/реплика/возобновление, and their invariants differ (one session at a
    # time, no live-attach, direct kill vs. the cooperative break).
    #
    # 🔴 It is a SIBLING package (`src/bob/interactive/`), not a sub-package of
    # `src/bob/coding/`, and that is load-bearing: `max_symbols` counts by SOURCE PREFIX
    # (`code_symbols.file_path LIKE '<source>%'`), so a node nested under coding's source
    # would be counted TWICE — coding's number would not drop by a single symbol and the
    # split would be cosmetic.
    #
    # Same non-layer `module-vertical` tag as its siblings (spans domain+application+
    # infra inside ONE context, so the tag-based `architecture-layers` rule skips its
    # edges); its internal layering + outer boundary are enforced by the GENERATED
    # path-glob `forbid_import` rules in rules.yml. The `interactive → coding` edge is
    # deliberate and one-directional — see the note block at the end of rules.yml.
    tags: [module-vertical]
    summary: 'Interactive module («Боб держит живой терминал») — the live bidirectional `claude` session in the owner''s DM: pure domain (mode intent, resume policy + negotiation, argv policy, the mode''s voice, the live-session holder), `usecases/` (session manager, teardown, DM intake router, boot-time sweep of orphaned sessions), and `adapters/` (the persistent stream-json runner). Rests on coding''s shared session surface; coding never imports it. Split out of `coding` in BOB-087.E.'
    docs:
      - domains/interactive/README.md

  - ref_id: capabilities
    kind: feature
    source: src/bob/capabilities/
    # BOB-062.4: domain-first VERTICAL module — spans domain+application+infra
    # INSIDE one bounded context, so it is NOT a horizontal layer. Tag is the
    # non-layer `module-vertical` (like `memory` / `proactivity` / `coding`) so
    # the tag-based `architecture-layers` rule silently skips its edges; the
    # module's INTERNAL layering and its OUTER boundary are enforced by the
    # path-glob `forbid_import` rules in .beadloom/_graph/rules.yml (§ vertical
    # modules; the capabilities rules land in BOB-062.4 .3). Consolidates the
    # former `diagrams-domain` + `introspection-domain` + `capabilities-app` +
    # `web` + `diagrams-infra` + `introspection-infra` nodes (plus the
    # `web_search_qwen` transport moved out of `llm`) — the GUPPI tool seam and
    # its grounded skills are ONE «Bob's tools» capability. `domain/ports/`
    # keeps a thin re-export shim for the 18 capability ports.
    tags: [module-vertical]
    summary: 'Capabilities module («Bob''s tools») — the full vertical GUPPI tool seam in one place: `ports.py` (Capability contract + tool/web/diagram/introspection ports) + pure `diagrams`/`introspection` value objects, `usecases/` (CapabilityRegistry + ToolLoop and the skills: recall/search memory, read code/url, web search, render diagram, inspect architecture, progress announcer), and `adapters/` (aiohttp URL reader behind an SSRF guard, mermaid renderer, beadloom/git introspector, Qwen web-search transport). Domain-first slice BOB-062.4.'
    docs:
      - domains/capabilities/README.md

  - ref_id: social
    kind: feature
    source: src/bob/social/
    # BOB-062.5: domain-first VERTICAL module — spans domain+application+infra
    # INSIDE one bounded context, so it is NOT a horizontal layer. Tag is the
    # non-layer `module-vertical` (like `memory` / `proactivity` / `coding` /
    # `capabilities`) so the tag-based `architecture-layers` rule silently skips
    # its edges; the module's INTERNAL layering and its OUTER boundary are
    # enforced by the path-glob `forbid_import` rules in
    # .beadloom/_graph/rules.yml (§ vertical modules, extended in .5). Consolidates
    # the former `permission` domain + `authz` application node + the
    # `domain/personality/{interlocutor,first_impression,relationship,sulk}` value
    # objects + `usecases/{permission_*,*_sources,run_genesis}` + persistence
    # social stores + `llm/privilege_judge` + `ports/social` — social identity,
    # relationships, permission and genesis are ONE «Bob distinguishes people»
    # capability. The personality↔social cycle is broken in code (.1): `voice.py`
    # no longer imports `InterlocutorKind` at runtime (uses `kind.value`); social
    # depends on personality one-way (`relationship → negotiation.Stance`).
    # `domain/ports/` keeps a thin re-export shim for the social ports. The durable
    # social stores consume the shared persistence kernel via the injected
    # `SqliteConnection` seam (the connection-kernel split out in BOB-062.7b).
    tags: [module-vertical]
    docs:
      - domains/social/README.md
    summary: 'Social module («Bob distinguishes people») — the full vertical capability in one place: `ports.py` + pure domain (interlocutor identity, first-impression, relationship, sulk) + `permission/` value objects, `usecases/` (authorizer/sender+reactor perception, permission flow/execution, first-impression/relationship/sulk sources, run-genesis), and `adapters/` (first-impression/relationship/sulk/allowlist/permission-request/soul stores + privilege-judge). Domain-first slice BOB-062.5.'

  - ref_id: presence
    kind: feature
    source: src/bob/presence/
    # BOB-066 Срез 2.3: domain-first VERTICAL module — the ритм-слой of «человеческое
    # групповое присутствие». Like the other module-vertical bounded contexts it spans
    # domain+adapters INSIDE one context, so it is NOT a horizontal layer. Tag is the
    # non-layer `module-vertical` (like `proactivity` / `social`) so the tag-based
    # `architecture-layers` rule skips its edges; its INTERNAL layering + OUTER boundary
    # are enforced by the path-glob `forbid_import` rules generated into
    # .beadloom/_graph/rules.yml by scripts/gen_boundary_rules.py. Deliberately a
    # SEPARATE bounded context (not folded into proactivity): share-of-voice / natural
    # delay / reaction budget are about the RHYTHM of a live participant, a distinct
    # responsibility from the drive engine. Pure domain (no I/O, now/rng injected); the
    # one adapter reads Bob's airtime off the shared episodic log. Its application
    # collaborators (DelayedTurn, ShareOfVoiceGate) live under `application/runtime/`.
    tags: [module-vertical]
    summary: 'Presence module («Bob''s living rhythm») — the ритм-слой of human group presence: `ports.py` + pure domain (OutgoingActivity rolling window, ShareOfVoicePolicy soft ambient ceiling with focus-bypass, NaturalDelayPolicy human reply floor, ReactionBudget gentle like budget, RhythmConfig tunables) + `adapters/` (episodic-log OutgoingActivityStore). Domain-first slice BOB-066.2.3; inert behind the `presence.rhythm` flag until the epic ships.'
    docs:
      - domains/presence/README.md

  # ── Application submodules (kind: feature, part_of bob-application) ──────────
  - ref_id: usecases
    kind: feature
    source: src/bob/application/usecases/
    tags: [layer-application]
    summary: 'Use-cases — HandleMessage, RunGenesis, UpdateMoodFromText, goal/memory/reflection flows orchestrating domain + ports.'
    docs:
      - domains/application/features/usecases/SPEC.md

  - ref_id: router
    kind: feature
    source: src/bob/application/router/
    tags: [layer-application]
    summary: 'LLMRouter — Tier 0/1 model routing with privacy redaction before any model call.'
    docs:
      - domains/application/features/router/SPEC.md

  - ref_id: runtime-app
    kind: feature
    source: src/bob/application/runtime/
    tags: [layer-application]
    summary: 'Application runtime — AgentRuntime, AsyncEventBus, events, and resilient heartbeat ticks (retry/backoff). Distinct from the `runtime` composition root.'
    docs:
      - domains/application/features/runtime-app/SPEC.md

  # ── Infrastructure submodules (kind: component, part_of bob-infrastructure) ──
  - ref_id: llm
    kind: component
    source: src/bob/infrastructure/llm/
    tags: [layer-infra]
    summary: 'LLM adapter — OpenAI-compatible provider for Tier 0/1 completion + tool-calling (Ollama/Qwen backend).'
    docs:
      - domains/infrastructure/features/llm/SPEC.md

  - ref_id: telegram
    kind: component
    source: src/bob/infrastructure/telegram/
    tags: [layer-infra]
    summary: 'Telegram adapter — aiogram gateway (long-polling, authz gate, native draft streaming, Rich Messages, topic-thread reply pinning), MultiBotGateway (BotRegistry + cross-bot dedup + identity/scope router) and the GuppiHandler gatekeeper.'
    docs:
      - domains/infrastructure/features/telegram/SPEC.md

  - ref_id: persistence
    kind: component
    source: src/bob/infrastructure/persistence/
    tags: [layer-infra]
    summary: 'Persistence kernel — the shared `SqliteConnection` (open/WAL/foreign_keys/sqlite-vec load/`schema.sql`/kv/close) that the memory adapter and the 13 per-module durable stores read through the injected `connection` seam. Pure I/O: carries no memory/business logic — those realisations live in their owning modules'' `adapters/` (BOB-062.2–.7b).'
    docs:
      - domains/infrastructure/features/persistence/SPEC.md

  - ref_id: config
    kind: component
    source: src/bob/infrastructure/config/
    tags: [layer-infra]
    summary: 'Config adapter — two-bot layered config loader (env + files) for the running process.'
    docs:
      - domains/infrastructure/features/config/SPEC.md

edges:
  # ── Root service self-reference (satisfies service-needs-parent convention) ─
  - src: bob
    dst: bob
    kind: part_of

  # ── Layers part_of the service ──────────────────────────────────────────────
  - src: runtime
    dst: bob
    kind: part_of
  - src: bob-domain
    dst: bob
    kind: part_of
  - src: bob-application
    dst: bob
    kind: part_of
  - src: bob-infrastructure
    dst: bob
    kind: part_of

  # ── Domain submodules part_of the domain layer ──────────────────────────────
  - src: kernel
    dst: bob-domain
    kind: part_of
  - src: personality
    dst: bob-domain
    kind: part_of
  - src: conversation
    dst: bob-domain
    kind: part_of
  - src: memory
    dst: bob-domain
    kind: part_of
  - src: proactivity
    dst: bob-domain
    kind: part_of
  - src: coding
    dst: bob-domain
    kind: part_of
  - src: interactive
    dst: bob-domain
    kind: part_of
  - src: capabilities
    dst: bob-domain
    kind: part_of
  - src: social
    dst: bob-domain
    kind: part_of
  - src: presence
    dst: bob-domain
    kind: part_of

  # ── Application submodules part_of the application layer ─────────────────────
  - src: usecases
    dst: bob-application
    kind: part_of
  - src: router
    dst: bob-application
    kind: part_of
  - src: runtime-app
    dst: bob-application
    kind: part_of

  # ── Infrastructure submodules part_of the infrastructure layer ──────────────
  - src: llm
    dst: bob-infrastructure
    kind: part_of
  - src: telegram
    dst: bob-infrastructure
    kind: part_of
  - src: persistence
    dst: bob-infrastructure
    kind: part_of
  - src: config
    dst: bob-infrastructure
