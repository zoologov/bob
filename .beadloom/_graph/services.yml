# Bob architecture graph — BOB-065 Часть B (detailed graph).
#
# Hierarchy: service `bob` → layers (domain / application / infrastructure +
# runtime composition root) → submodule nodes on REAL current paths. Layer is
# expressed as a tag on the node (the engine keys layer rules off tags, not code
# markers). Files map to the DEEPEST node whose `source:` prefix contains them
# (import_resolver._find_node_for_file), so the 186 blanket `# beadloom:domain=bob`
# headers stay inert — they resolve to ref_id `domain:bob` (no such node) and fall
# through to source-prefix matching; no mass re-annotation is required.
#
# NOTE (Фаза 3 / BOB-062 boundary): submodule `source:` paths describe the CURRENT
# layered layout. When the code physically moves to domain-first verticals, only
# the `source:` values are retargeted — ref_ids, kinds, tags and the layer nodes
# survive the reorg.

nodes:
  # ── Root service ────────────────────────────────────────────────────────────
  - ref_id: bob
    kind: service
    source: src/bob/
    tags: [layer-runtime]
    summary: 'Bob — Telegram-native companion agent: GUPPI process, LLM Tier 0/1 router with privacy redaction, SQLite+FTS5 memory, Higher Mind, Genesis, heartbeat. Two admin bots in one process (BOB-003): a MultiBotGateway (BotRegistry) polls both Bob and GUPPI, dedups cross-bot by (chat_id, message_id), and a central router dispatches by identity+scope — Bob lives in his forum topic, GUPPI is the gatekeeper in General with a visible unauthorized reject + owner commands. aiogram transport (native draft streaming + Rich Messages), owner/allowlist/chat-scope authz, resilient ticks, and a capability seam (registry + tool-loop) executed by GUPPI.'
    docs:
      - architecture.md

  # ── Runtime composition root ────────────────────────────────────────────────
  - ref_id: runtime
    kind: service
    source: src/bob/app.py
    tags: [layer-runtime]
    summary: 'Composition root (`app.py`) — the only module allowed to wire all layers at once: loads layered config, builds infrastructure adapters, composes application policy + use-cases, subscribes handlers to the EventBus, registers ticks + Telegram polling, runs Genesis once, and starts the process.'
    docs:
      - services/runtime.md

  # ── Layer: Domain ───────────────────────────────────────────────────────────
  - ref_id: bob-domain
    kind: domain
    source: src/bob/domain/
    tags: [layer-domain]
    summary: 'Pure domain core: personality (Mood, TasteEngine, Negotiation, SOUL), memory entities, and port protocols (LLMProvider, ToolCallingProvider, Capability, AllowlistStore). No I/O, no LLM, no transport.'
    docs:
      - domains/domain/README.md

  # ── Layer: Application ──────────────────────────────────────────────────────
  - ref_id: bob-application
    kind: domain
    source: src/bob/application/
    tags: [layer-application]
    summary: 'GUPPI orchestration: AgentRuntime + AsyncEventBus, LLMRouter (tier routing + privacy redaction), use-cases (HandleMessage, RunGenesis, UpdateMoodFromText), resilient heartbeat ticks (retry/backoff), the Authorizer access policy and the capability seam (CapabilityRegistry + ToolLoop + recall_memory). Depends on domain via ports; never imports infrastructure.'
    docs:
      - domains/application/README.md

  # ── Layer: Infrastructure ───────────────────────────────────────────────────
  - ref_id: bob-infrastructure
    kind: domain
    source: src/bob/infrastructure/
    tags: [layer-infra]
    summary: 'Port adapters: aiogram Telegram gateway (long-polling + authz gate, native draft streaming, Rich Messages, markdown<->RichMessage, topic-thread reply pinning), MultiBotGateway (BotRegistry + cross-bot dedup + central identity/scope router) and the GuppiHandler gatekeeper (visible reject + owner commands), OpenAI-compatible LLM provider (Tier 0/1 + tool-calling), SQLite+FTS5 persistence, KvAllowlistStore and SoulStore, two-bot layered config loader.'
    docs:
      - domains/infrastructure/README.md

  # ── Domain submodules (kind: feature, part_of bob-domain) ───────────────────
  - ref_id: ports
    kind: feature
    source: src/bob/domain/ports/
    tags: [layer-domain]
    summary: 'Domain ports — the port protocols the outer layers implement (LLMProvider, ToolCallingProvider, Capability, AllowlistStore, conversation/memory/social/coding/proactivity/kernel seams). Pure Protocol definitions; no I/O.'

  - ref_id: personality
    kind: feature
    source: src/bob/domain/personality/
    tags: [layer-domain]
    summary: 'Personality core — Mood five-axis affect, TasteEngine, Negotiation, SOUL/disposition value objects driving Bob''s tone.'

  - ref_id: memory
    kind: feature
    source: src/bob/memory/
    # BOB-062.2: domain-first VERTICAL module — spans domain+application+infra
    # INSIDE one bounded context, so it is NOT a horizontal layer. Tag is the
    # non-layer `module-vertical` (like `coding`) so the tag-based
    # `architecture-layers` rule silently skips its edges; the module's INTERNAL
    # layering and its OUTER boundary are enforced by the path-glob `forbid_import`
    # rules in .beadloom/_graph/rules.yml (§ vertical modules, added in .2).
    # NB: the durable episode/fact store (`SqliteMemoryRepo`) stays in the shared
    # persistence kernel until BOB-062.7; its lone reach into `bob.memory.entities`
    # is the deliberately-allowed `kernel → memory` edge (marked in .2).
    tags: [module-vertical]
    summary: 'Memory module («Bob remembers») — the full vertical capability in one place: `ports.py` + pure `entities`, `usecases/` (extract facts, consolidate, dedup), and `adapters/` (FTS5/hybrid recall + local Ollama embedder/reranker). Domain-first slice BOB-062.2.'
    docs:
      - domains/memory/README.md

  - ref_id: proactivity
    kind: feature
    source: src/bob/proactivity/
    # BOB-062.3: domain-first VERTICAL module — spans domain+application+infra
    # INSIDE one bounded context, so it is NOT a horizontal layer. Tag is the
    # non-layer `module-vertical` (like `memory` / `coding`) so the tag-based
    # `architecture-layers` rule silently skips its edges; the module's INTERNAL
    # layering and its OUTER boundary are enforced by the path-glob `forbid_import`
    # rules in .beadloom/_graph/rules.yml (§ vertical modules, extended in .2).
    # Consolidates the former `proactivity-domain` + `proactivity-app` + `goals`
    # nodes: drive-model, goals, and self-improvement are ONE «Bob's background
    # life» capability. `self_improvement.py` moved in from `personality`
    # (metacognition over behaviour, BOB-028, not a personality trait). The 4
    # durable stores consume the shared persistence kernel via the
    # `SqliteMemoryRepo.connection()` seam (kernel stays put until BOB-062.7).
    tags: [module-vertical]
    summary: 'Proactivity module («Bob''s background life») — the full vertical capability in one place: `ports.py` + pure domain (drive-model urge/governance/social-energy, goals graph, self-improvement rules), `usecases/` (engine/tick, plan/pursue goals, detect-patterns/announce-rules), and `adapters/` (proactivity/goal/self-improvement stores + live read-seams). Domain-first slice BOB-062.3.'
    docs:
      - domains/proactivity/README.md

  - ref_id: coding
    kind: feature
    source: src/bob/coding/
    # BOB-062.1: domain-first VERTICAL module — spans domain+application+infra
    # INSIDE one bounded context, so it is NOT a horizontal layer. Tag is the
    # non-layer `module-vertical` (deliberately not `layer-*`) so the tag-based
    # `architecture-layers` rule silently skips its edges; the module's INTERNAL
    # layering and its OUTER boundary are enforced instead by the path-glob
    # `forbid_import` rules in .beadloom/_graph/rules.yml (§ vertical modules).
    # Rationale: as a single node it cannot satisfy the layers rule — `ports`
    # (domain) re-exports `coding` (needs coding ≤ domain) while `coding` uses the
    # shared `router` (needs coding ≥ application); contradictory for one layer tag.
    tags: [module-vertical]
    summary: 'Coding module («Bob writes code») — the full vertical capability in one place: `ports.py` + pure domain logic, `usecases/` orchestration, and `adapters/` (Claude Code CLI, git worktree, gh PR, session store, indicator). Domain-first slice BOB-062.1.'
    docs:
      - domains/coding/README.md

  - ref_id: capabilities
    kind: feature
    source: src/bob/capabilities/
    # BOB-062.4: domain-first VERTICAL module — spans domain+application+infra
    # INSIDE one bounded context, so it is NOT a horizontal layer. Tag is the
    # non-layer `module-vertical` (like `memory` / `proactivity` / `coding`) so
    # the tag-based `architecture-layers` rule silently skips its edges; the
    # module's INTERNAL layering and its OUTER boundary are enforced by the
    # path-glob `forbid_import` rules in .beadloom/_graph/rules.yml (§ vertical
    # modules; the capabilities rules land in BOB-062.4 .3). Consolidates the
    # former `diagrams-domain` + `introspection-domain` + `capabilities-app` +
    # `web` + `diagrams-infra` + `introspection-infra` nodes (plus the
    # `web_search_qwen` transport moved out of `llm`) — the GUPPI tool seam and
    # its grounded skills are ONE «Bob's tools» capability. `domain/ports/`
    # keeps a thin re-export shim for the 18 capability ports.
    tags: [module-vertical]
    summary: 'Capabilities module («Bob''s tools») — the full vertical GUPPI tool seam in one place: `ports.py` (Capability contract + tool/web/diagram/introspection ports) + pure `diagrams`/`introspection` value objects, `usecases/` (CapabilityRegistry + ToolLoop and the skills: recall/search memory, read code/url, web search, render diagram, inspect architecture, progress announcer), and `adapters/` (aiohttp URL reader behind an SSRF guard, mermaid renderer, beadloom/git introspector, Qwen web-search transport). Domain-first slice BOB-062.4.'
    docs:
      - domains/capabilities/README.md

  - ref_id: social
    kind: feature
    source: src/bob/social/
    # BOB-062.5: domain-first VERTICAL module — spans domain+application+infra
    # INSIDE one bounded context, so it is NOT a horizontal layer. Tag is the
    # non-layer `module-vertical` (like `memory` / `proactivity` / `coding` /
    # `capabilities`) so the tag-based `architecture-layers` rule silently skips
    # its edges; the module's INTERNAL layering and its OUTER boundary are
    # enforced by the path-glob `forbid_import` rules in
    # .beadloom/_graph/rules.yml (§ vertical modules, extended in .5). Consolidates
    # the former `permission` domain + `authz` application node + the
    # `domain/personality/{interlocutor,first_impression,relationship,sulk}` value
    # objects + `usecases/{permission_*,*_sources,run_genesis}` + persistence
    # social stores + `llm/privilege_judge` + `ports/social` — social identity,
    # relationships, permission and genesis are ONE «Bob distinguishes people»
    # capability. The personality↔social cycle is broken in code (.1): `voice.py`
    # no longer imports `InterlocutorKind` at runtime (uses `kind.value`); social
    # depends on personality one-way (`relationship → negotiation.Stance`).
    # `domain/ports/` keeps a thin re-export shim for the social ports. The durable
    # social stores consume the shared persistence kernel via the
    # `SqliteMemoryRepo.connection()` seam (kernel stays put until BOB-062.7).
    tags: [module-vertical]
    docs:
      - domains/social/README.md
    summary: 'Social module («Bob distinguishes people») — the full vertical capability in one place: `ports.py` + pure domain (interlocutor identity, first-impression, relationship, sulk) + `permission/` value objects, `usecases/` (authorizer/sender+reactor perception, permission flow/execution, first-impression/relationship/sulk sources, run-genesis), and `adapters/` (first-impression/relationship/sulk/allowlist/permission-request/soul stores + privilege-judge). Domain-first slice BOB-062.5.'

  # ── Application submodules (kind: feature, part_of bob-application) ──────────
  - ref_id: usecases
    kind: feature
    source: src/bob/application/usecases/
    tags: [layer-application]
    summary: 'Use-cases — HandleMessage, RunGenesis, UpdateMoodFromText, goal/memory/reflection flows orchestrating domain + ports.'

  - ref_id: router
    kind: feature
    source: src/bob/application/router/
    tags: [layer-application]
    summary: 'LLMRouter — Tier 0/1 model routing with privacy redaction before any model call.'

  - ref_id: runtime-app
    kind: feature
    source: src/bob/application/runtime/
    tags: [layer-application]
    summary: 'Application runtime — AgentRuntime, AsyncEventBus, events, and resilient heartbeat ticks (retry/backoff). Distinct from the `runtime` composition root.'

  # ── Infrastructure submodules (kind: component, part_of bob-infrastructure) ──
  - ref_id: llm
    kind: component
    source: src/bob/infrastructure/llm/
    tags: [layer-infra]
    summary: 'LLM adapter — OpenAI-compatible provider for Tier 0/1 completion + tool-calling (Ollama/Qwen backend).'

  - ref_id: telegram
    kind: component
    source: src/bob/infrastructure/telegram/
    tags: [layer-infra]
    summary: 'Telegram adapter — aiogram gateway (long-polling, authz gate, native draft streaming, Rich Messages, topic-thread reply pinning), MultiBotGateway (BotRegistry + cross-bot dedup + identity/scope router) and the GuppiHandler gatekeeper.'

  - ref_id: persistence
    kind: component
    source: src/bob/infrastructure/persistence/
    tags: [layer-infra]
    summary: 'Persistence adapter — SQLite+FTS5 repository, KvAllowlistStore and SoulStore backing memory recall and stores.'

  - ref_id: config
    kind: component
    source: src/bob/infrastructure/config/
    tags: [layer-infra]
    summary: 'Config adapter — two-bot layered config loader (env + files) for the running process.'

edges:
  # ── Root service self-reference (satisfies service-needs-parent convention) ─
  - src: bob
    dst: bob
    kind: part_of

  # ── Layers part_of the service ──────────────────────────────────────────────
  - src: runtime
    dst: bob
    kind: part_of
  - src: bob-domain
    dst: bob
    kind: part_of
  - src: bob-application
    dst: bob
    kind: part_of
  - src: bob-infrastructure
    dst: bob
    kind: part_of

  # ── Domain submodules part_of the domain layer ──────────────────────────────
  - src: ports
    dst: bob-domain
    kind: part_of
  - src: personality
    dst: bob-domain
    kind: part_of
  - src: memory
    dst: bob-domain
    kind: part_of
  - src: proactivity
    dst: bob-domain
    kind: part_of
  - src: coding
    dst: bob-domain
    kind: part_of
  - src: capabilities
    dst: bob-domain
    kind: part_of
  - src: social
    dst: bob-domain
    kind: part_of

  # ── Application submodules part_of the application layer ─────────────────────
  - src: usecases
    dst: bob-application
    kind: part_of
  - src: router
    dst: bob-application
    kind: part_of
  - src: runtime-app
    dst: bob-application
    kind: part_of

  # ── Infrastructure submodules part_of the infrastructure layer ──────────────
  - src: llm
    dst: bob-infrastructure
    kind: part_of
  - src: telegram
    dst: bob-infrastructure
    kind: part_of
  - src: persistence
    dst: bob-infrastructure
    kind: part_of
  - src: config
    dst: bob-infrastructure
    kind: part_of

  # ── Declarative Clean-Architecture layer dependencies ───────────────────────
  # (Fine-grained depends_on between submodules is derived from real imports by
  #  the import resolver — not duplicated here.)
  - src: bob-application
    dst: bob-domain
    kind: depends_on
  - src: bob-infrastructure
    dst: bob-application
    kind: depends_on
  - src: bob-infrastructure
    dst: bob-domain
    kind: depends_on
  - src: runtime
    dst: bob-domain
    kind: depends_on
  - src: runtime
    dst: bob-application
    kind: depends_on
  - src: runtime
    dst: bob-infrastructure
    kind: depends_on
