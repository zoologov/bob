  # 🔴 BOB-091.2 — ОСОЗНАННАЯ РЕКАЛИБРОВКА одного узла, и вместе с ней ЗАПИСАННЫЙ ДОЛГ
  # (BOB-Issues #44 + БЕАДА bob-fyf / BOB-092 — чтобы отсрочка имела адресата, а не только
