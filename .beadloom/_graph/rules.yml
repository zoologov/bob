# Bob Architecture-as-Code ruleset — BOB-065 Часть C (max AaC).
#
# All primitives are real rule-engine types (beadloom graph/rules/): require,
# forbid_cycles, layers, forbid_import, deny, module_coverage, check. Node
# matchers key off ref_id/kind/tag (AND). Layer membership comes from the tag on
# each node in services.yml (layer-runtime / layer-infra / layer-application /
# layer-domain). Clean-Architecture direction: imports point INWARD —
# runtime → infrastructure → application → domain; domain depends on nobody.
#
# Severity ratchet (RFC Часть C): error where the code is already clean. As of
# BOB-062.8 .2 the ratchet is FULLY CLOSED — Фаза 3 (BOB-062) decomposed the known
# big modules (handle_message split in .6b, app.py → an 82-line runtime shim in
# .7a), so `no-monster-modules` is now `error` too (0 feature nodes over budget at
# flip time). gateway.py remains a `component` (outside the feature-scoped check),
# tracked separately under #25.
version: 3

rules:
  # ── Structural integrity ────────────────────────────────────────────────────
  - name: domain-needs-parent
    description: "Каждый domain-узел (слой) — part_of сервиса bob"
    require:
      for: {kind: domain}
      has_edge_to: {ref_id: bob}
      edge_kind: part_of

  - name: feature-needs-parent
    description: "Каждая feature — part_of своего слоя (kind domain)"
    require:
      for: {kind: feature}
      has_edge_to: {kind: domain}
      edge_kind: part_of

  - name: component-needs-parent
    description: "Каждый component — part_of своего слоя (kind domain)"
    require:
      for: {kind: component}
      has_edge_to: {kind: domain}
      edge_kind: part_of

  - name: no-dependency-cycles
    description: "Никаких циклов depends_on между узлами"
    severity: error
    forbid_cycles: {edge_kind: depends_on}

  # ── Layer direction (main teeth) ────────────────────────────────────────────
  # Order top→bottom = most-dependent … most-independent. depends_on edges are
  # derived from REAL imports (tree-sitter) + declared layer edges, so this bites
  # actual code. allow_skip: true — infra→domain (port impls) and runtime→domain
  # are legal downward skips.
  - name: architecture-layers
    description: "runtime → infrastructure → application → domain; не обратно"
    severity: error
    layers:
      - {name: runtime,        tag: layer-runtime}
      - {name: infrastructure, tag: layer-infra}
      - {name: application,    tag: layer-application}
      - {name: domain,         tag: layer-domain}
    enforce: top-down
    allow_skip: true
    edge_kind: depends_on

  # ── Hard import boundaries (scan real imports, path globs) ───────────────────
  # GLOB SEMANTICS (rule engine = Python fnmatch): `from` matches file_path,
  # which carries the `src/bob/...` prefix; `to` matches the IMPORTED module path
  # (dotted→slash, e.g. `bob.infrastructure.x` → `bob/infrastructure/x`) which has
  # NO `src/` prefix. `*` in fnmatch spans `/`. BOB-062.1 fix: the `to:` globs
  # below previously read `src/bob/...` and therefore NEVER matched (dead rules);
  # corrected to the prefix-less `bob/...` form so they actually bite.
  #
  # BOB-062.8: the two former `domain-*` rules (`domain-imports-nothing-outward`,
  # `domain-no-infra`) referenced `src/bob/domain/**`, which was deleted when the
  # layer-first `src/bob/domain/` package was fully dissolved into the vertical
  # modules and the shared `src/bob/kernel/`. Their intent (inward-only imports)
  # is now covered by the per-module `*-internals-no-adapters` / `module-boundary`
  # generated rules plus the `kernel-no-*` guards below, so they were removed.
  - name: application-no-infra
    description: "Application не импортит infrastructure (только через порты домена)"
    severity: error
    forbid_import: {from: "src/bob/application/**", to: "bob/infrastructure/**"}

  # ── Domain-first VERTICAL modules — per-module boundaries (GENERATED) ─────────
  # A vertical module (src/bob/<module>/) bundles its own domain logic (root *.py +
  # ports.py), `usecases/` (application), and `adapters/` (infrastructure) inside ONE
  # bounded context. It is NOT a horizontal layer, so it carries the non-layer tag
  # `module-vertical` (skipped by `architecture-layers`); its discipline is enforced
  # HERE by real-import path globs.
  #
  # 🔴 The rules between the markers below are GENERATED by
  # `scripts/gen_boundary_rules.py` from the `module-vertical` nodes in services.yml —
  # DO NOT hand-edit them; edit the generator and re-run it (CI runs `--check`).
  # They use EXPLICIT per-module paths (`src/bob/coding/`, …), NOT fnmatch char-classes:
  # a single-char class (`src/bob/[adimp]*`) keys off the FIRST letter, so it could not
  # isolate two modules that share it — `capabilities` (c…) vs `coding` (c…). Explicit
  # paths dodge that collision. Per module M the generator emits: usecases-no-adapters,
  # internals-no-usecases (base `[!u]*` + an EXPLICIT `-<file>` patch rule for every
  # u-prefixed root file, e.g. `proactivity/urge.py`), internals-no-adapters (base
  # `[!au]*` + explicit `-<file>` patches for a/u root files: addressivity/absence/
  # urge), usecases-no-infra, no-composition-root, no-runtime-root, and one inward
  # boundary rule per OTHER module-vertical → usecases and → adapters. 🔴 BOB-062.8 .2
  # CLOSED the char-class a/u hole: the base `[!au]*`/`[!u]*` still efficiently drops
  # the adapters/usecases subtrees, but every root file the class would silently
  # swallow (first char a/u) is re-added by an explicit-path patch rule, and the
  # generator asserts per-run that every module internal is covered — no root file can
  # import its own adapters/usecases undetected any more. The pure `domain` layer is
  # NO LONGER an inward source (its folder was deleted in .8 .1; the shared `kernel`
  # imports nothing, so it is neither an isolation source nor target). The legalized
  # cross-boundary refs are documented in the hand-authored note blocks at the END of
  # this file — those stay OUTSIDE the generated region.

