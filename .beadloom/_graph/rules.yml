# Bob Architecture-as-Code ruleset — BOB-065 Часть C (max AaC).
#
# All primitives are real rule-engine types (beadloom graph/rules/): require,
# forbid_cycles, layers, forbid_import, deny, module_coverage, check. Node
# matchers key off ref_id/kind/tag (AND). Layer membership comes from the tag on
# each node in services.yml (layer-runtime / layer-infra / layer-application /
# layer-domain). Clean-Architecture direction: imports point INWARD —
# runtime → infrastructure → application → domain; domain depends on nobody.
#
# Severity ratchet (RFC Часть C): error where the code is already clean;
# no-monster-modules stays warn until Фаза 3 (BOB-062) decomposes the known big
# modules (handle_message / app.py / gateway, tracked #9/#10/#25).
version: 3

rules:
  # ── Structural integrity ────────────────────────────────────────────────────
  - name: domain-needs-parent
    description: "Каждый domain-узел (слой) — part_of сервиса bob"
    require:
      for: {kind: domain}
      has_edge_to: {ref_id: bob}
      edge_kind: part_of

  - name: feature-needs-parent
    description: "Каждая feature — part_of своего слоя (kind domain)"
    require:
      for: {kind: feature}
      has_edge_to: {kind: domain}
      edge_kind: part_of

  - name: component-needs-parent
    description: "Каждый component — part_of своего слоя (kind domain)"
    require:
      for: {kind: component}
      has_edge_to: {kind: domain}
      edge_kind: part_of

  - name: no-dependency-cycles
    description: "Никаких циклов depends_on между узлами"
    severity: error
    forbid_cycles: {edge_kind: depends_on}

  # ── Layer direction (main teeth) ────────────────────────────────────────────
  # Order top→bottom = most-dependent … most-independent. depends_on edges are
  # derived from REAL imports (tree-sitter) + declared layer edges, so this bites
  # actual code. allow_skip: true — infra→domain (port impls) and runtime→domain
  # are legal downward skips.
  - name: architecture-layers
    description: "runtime → infrastructure → application → domain; не обратно"
    severity: error
    layers:
      - {name: runtime,        tag: layer-runtime}
      - {name: infrastructure, tag: layer-infra}
      - {name: application,    tag: layer-application}
      - {name: domain,         tag: layer-domain}
    enforce: top-down
    allow_skip: true
    edge_kind: depends_on

  # ── Hard import boundaries (scan real imports, path globs) ───────────────────
  # GLOB SEMANTICS (rule engine = Python fnmatch): `from` matches file_path,
  # which carries the `src/bob/...` prefix; `to` matches the IMPORTED module path
  # (dotted→slash, e.g. `bob.infrastructure.x` → `bob/infrastructure/x`) which has
  # NO `src/` prefix. `*` in fnmatch spans `/`. BOB-062.1 fix: the `to:` globs
  # below previously read `src/bob/...` and therefore NEVER matched (dead rules);
  # corrected to the prefix-less `bob/...` form so they actually bite.
  - name: domain-imports-nothing-outward
    description: "Домен не импортит application"
    severity: error
    forbid_import: {from: "src/bob/domain/**", to: "bob/application/**"}

  - name: domain-no-infra
    description: "Домен не импортит infrastructure"
    severity: error
    forbid_import: {from: "src/bob/domain/**", to: "bob/infrastructure/**"}

  - name: application-no-infra
    description: "Application не импортит infrastructure (только через порты домена)"
    severity: error
    forbid_import: {from: "src/bob/application/**", to: "bob/infrastructure/**"}

  # ── Domain-first VERTICAL modules — per-module boundaries (BOB-062, #8) ───────
  # A vertical module (src/bob/<module>/) bundles its own domain logic (root
  # *.py + ports.py), `usecases/` (application), and `adapters/` (infrastructure)
  # inside ONE bounded context. It is NOT a horizontal layer, so it carries the
  # non-layer tag `module-vertical` (skipped by `architecture-layers`); its
  # discipline is enforced HERE, by real-import path globs. `coding` is the first
  # module (BOB-062.1) and the EXEMPLAR — replicate this block per module in
  # .2–.8 (swap `coding` for the module name; a future generator can parameterize
  # it). fnmatch limits (`*` spans `/`, no `!()`/`{}` negation) shape the globs:
  # `to:` targets are prefix-less `bob/...`; `[adi]*` selects the legacy
  # application/domain/infrastructure trees while excluding `coding` (c…) and the
  # `src/bob/app.py` composition root.

  # Internal layering: usecases orchestrate via PORTS, never importing concrete
  # adapters (adapters are wired at the composition root, src/bob/app.py).
  - name: coding-usecases-no-adapters
    description: "coding: usecases не импортят adapters (только порты; adapters — на композиции)"
    severity: error
    forbid_import: {from: "src/bob/coding/usecases/*", to: "bob/coding/adapters/*"}

  # Internal layering: nothing INSIDE the module imports a usecase — usecases are
  # instantiated only by the external composition root. Covers domain-root↛usecases
  # and adapters↛usecases in one rule. (domain-root↛adapters cannot be expressed
  # without also flagging legal adapter↔adapter sibling imports, because fnmatch
  # `*` spans `/`; domain files stay pure by being import-leaves — see review.)
  - name: coding-internals-no-usecases
    description: "coding: доменная логика/адаптеры не импортят usecases (usecases — на композиции)"
    severity: error
    forbid_import: {from: "src/bob/coding/*", to: "bob/coding/usecases/*"}

  # Module boundary (inward): the outside world reaches `coding` only through its
  # facade (`__init__.py`) / `ports.py` — never into `usecases/` or `adapters/`.
  # `src/bob/[adim]*/*` = the application/domain/infrastructure trees PLUS the
  # `memory` vertical module (a|d|i|m…); `coding`-self (`c…`) and the
  # `src/bob/app.py` composition root are excluded (the latter legitimately wires
  # the internals). BOB-062.2: `m` was added when the `memory` module landed —
  # closing the pairwise isolation the original note anticipated (fnmatch cannot
  # correlate a from≠to module in a single glob, so each module is enumerated).
  # A future vertical (t…) extends this class again as it lands.
  - name: coding-boundary-no-outside-usecases
    description: "coding: снаружи не импортят usecases напрямую (только через фасад/порты)"
    severity: error
    forbid_import: {from: "src/bob/[adim]*/*", to: "bob/coding/usecases/*"}

  - name: coding-boundary-no-outside-adapters
    description: "coding: снаружи не импортят adapters напрямую (только через фасад/порты)"
    severity: error
    forbid_import: {from: "src/bob/[adim]*/*", to: "bob/coding/adapters/*"}

  # Module boundary (outward): a module must not depend on the composition root
  # that wires it (no inversion). `coding`'s ONLY legitimate outward runtime dep
  # is the SHARED `bob.application.router.llm_router` (an application-level router
  # that lives OUTSIDE any module) — see the 3 legalized cross-boundary refs in
  # the note block at the end of this file. That shared-router dependency is
  # therefore intentionally NOT forbidden here.
  - name: coding-no-composition-root
    description: "coding: модуль не импортит композиционный корень (src/bob/app.py)"
    severity: error
    forbid_import: {from: "src/bob/coding/*", to: "bob/app"}

  # ── Memory VERTICAL module — per-module boundaries (BOB-062.2, #12) ──────────
  # Second domain-first vertical module (see the `coding` exemplar above): same
  # discipline (internal layering + inward/outward boundary), enforced by real-
  # import path globs; `memory` carries `module-vertical` so `architecture-layers`
  # skips its edges. Two SHAPE differences from `coding` drive the glob choices:
  #   • memory's `usecases/__init__.py` and `adapters/__init__.py` DO re-export
  #     their own submodules (coding's `__init__` files are inert). Because fnmatch
  #     `*` spans `/`, a blanket `from: src/bob/memory/*` source glob would false-
  #     flag those LEGAL sibling package re-exports. So `internals-no-usecases`
  #     excludes the `usecases/` dir as a source via `[!u]*` (see its note).
  #   • a SECOND vertical module now exists, so the OUTSIDE-world source globs are
  #     `src/bob/[acdi]*/*` = application/coding/domain/infrastructure — every
  #     top-level tree EXCEPT memory-self (`m…`) and the `src/bob/app.py`
  #     composition root. (Symmetrically, the `coding` boundary globs above gained
  #     `m` so the two modules are isolated from each other in BOTH directions.)

  # Internal layering: usecases orchestrate via PORTS, never importing concrete
  # adapters (adapters are wired at the composition root, src/bob/app.py).
  - name: memory-usecases-no-adapters
    description: "memory: usecases не импортят adapters (только порты; adapters — на композиции)"
    severity: error
    forbid_import: {from: "src/bob/memory/usecases/*", to: "bob/memory/adapters/*"}

  # Internal layering: memory's domain-root (entities/ports/__init__) and adapters
  # must not import a usecase — usecases are instantiated only at the external
  # composition root. `src/bob/memory/[!u]*` excludes the `usecases/` dir as a
  # SOURCE (fnmatch `*` spans `/`), so LEGAL usecase↔usecase sibling re-exports
  # (memory/usecases/__init__.py) are not flagged; only non-usecase internals
  # (domain-root + adapters) are policed.
  - name: memory-internals-no-usecases
    description: "memory: доменная логика/адаптеры не импортят usecases (usecases — на композиции)"
    severity: error
    forbid_import: {from: "src/bob/memory/[!u]*", to: "bob/memory/usecases/*"}

  # Layer-guard INSIDE memory: its application layer (`usecases/`) now lives UNDER
  # src/bob/memory/ and is therefore OUTSIDE the reach of tests/application/
  # test_layering.py (which scans only `bob.application`). This restores that
  # guard at module scope: memory use-cases drive the pure domain through ports
  # and must not import foreign infrastructure. Runtime-level (code_imports omits
  # TYPE_CHECKING); a TYPE_CHECKING-level test analog is proposed for slice .3.
  - name: memory-usecases-no-infra
    description: "memory: usecases не импортят чужой infrastructure (только через порты)"
    severity: error
    forbid_import: {from: "src/bob/memory/usecases/*", to: "bob/infrastructure/*"}

  # Module boundary (inward): the outside world reaches `memory` only through its
  # facade (`__init__.py`) / `ports.py` / pure `entities` — never into `usecases/`
  # or `adapters/`. `src/bob/[acdi]*/*` = the application/coding/domain/infra
  # trees; memory-self (`m…`) and the `src/bob/app.py` composition root are
  # excluded (the latter legitimately wires the internals).
  - name: memory-boundary-no-outside-usecases
    description: "memory: снаружи не импортят usecases напрямую (только через фасад/порты)"
    severity: error
    forbid_import: {from: "src/bob/[acdi]*/*", to: "bob/memory/usecases/*"}

  - name: memory-boundary-no-outside-adapters
    description: "memory: снаружи не импортят adapters напрямую (только через фасад/порты)"
    severity: error
    forbid_import: {from: "src/bob/[acdi]*/*", to: "bob/memory/adapters/*"}

  # Module boundary (outward): memory must not import the composition root that
  # wires it (no inversion). Its legitimate outward deps are SHARED application
  # services that live OUTSIDE any module (`bob.application.router.llm_router`,
  # `bob.application.runtime.retry`) — intentionally NOT forbidden. `to: bob/app`
  # is an EXACT match for the `src/bob/app.py` root and does NOT match the longer
  # `bob/application/...` paths.
  - name: memory-no-composition-root
    description: "memory: модуль не импортит композиционный корень (src/bob/app.py)"
    severity: error
    forbid_import: {from: "src/bob/memory/*", to: "bob/app"}

  # ── Graph-edge backstop: domain layer must not depend on a service ──────────
  - name: no-domain-depends-on-outer
    description: "Домен-слой не зависит от сервисов (runtime/bob), кроме part_of"
    severity: error
    deny:
      from: {kind: domain}
      to:   {kind: service}
      unless_edge: [part_of]

  # ── Coverage: every src module is a tracked node or explicitly exempt ───────
  - name: module-coverage
    description: "Каждый src/bob модуль — трекнутый узел (feature/component/source) или exempt"
    severity: error
    module_coverage:
      source_root: src/bob/
      min_symbols: 1
      exempt:
        - "**/__init__.py"
        - "**/__main__.py"
        - "**/py.typed"
        # BOB-065: single util, place in Phase 3 — reliability.py is one loose
        # application helper (call_with_retry). The `ports` package is now a
        # tracked feature node in services.yml, so its exempt line is gone; only
        # this single util remains uncovered. The rule STAYS error so any NEW
        # shadow module still fails.
        - "src/bob/application/reliability.py"  # BOB-065: single util, place in Phase 3

  # ── Anti-monster (ratchet: warn now → error after Фаза 3 decomposition) ─────
  - name: no-monster-modules
    description: "Модуль-слой/фича не должен пухнуть (handle_message/app.py/gateway — #9/#10/#25)"
    severity: warn
    check:
      for: {kind: feature}
      max_symbols: 200

# ── BOB-062.2: the temporary kernel → memory edge (allowed until slice .7) ────
# The memory domain-first move left exactly ONE deliberately-allowed backward
# reference (kernel → memory), documented here so a reviewer sees the reasoning
# and no rule is added that would mask a real break:
#
#   bob.infrastructure.persistence.sqlite_repo → bob.memory.entities
#     (TYPE_CHECKING-only: EpisodicEvent, SemanticFact)
#   # BOB-062.2: kernel→memory, temporary until slice .7 (SqliteMemoryRepo split)
#
# `SqliteMemoryRepo` is genuinely a MEMORY adapter, but it still lives inside the
# SHARED persistence kernel (one sqlite_repo.py + schema.sql feeding 13 other
# stores through the `.connection()` seam). Owner decision (variant C, 2026-07-23):
# memory takes its business logic NOW; the store kernel splits out in BOB-062.7,
# where `SqliteMemoryRepo` separates into a connection-kernel and a `MemoryRepo`
# implementation and this edge disappears.
#
# Why it needs NO allow-rule and produces NO finding (not suppressed — genuinely
# clean): (a) the import is TYPE_CHECKING-only, so it is ABSENT from `code_imports`
# — no `forbid_import` match, and no `depends_on` edge, hence no cycle with the
# memory→kernel type-refs (hybrid_recall/fts_recall → SqliteMemoryRepo); and
# (b) it targets `entities`, memory's PUBLIC domain surface — NOT `usecases/` or
# `adapters/`, which the boundary globs above are the only memory paths they
# forbid. If it ever becomes a RUNTIME import it will surface (import scan / edge)
# and must be re-evaluated at .7 — do NOT pre-emptively suppress it.

# ── BOB-062.1: 3 legalized cross-boundary refs for the `coding` module ────────
# The domain-first move surfaced three cross-boundary references. All THREE are
# legal by design (not real violations); they are documented here deliberately so
# a later reviewer sees the reasoning and no rule is added that would mask a real
# break. None currently produces a lint finding (see rationale per item):
#
#   1. usecases/classify_coding_intent → application/router/llm_router
#      app→app dependency on the SHARED LLM router. `llm_router` is a general
#      application-level service that lives OUTSIDE any vertical module (all
#      capabilities route through it). Legal. It is why `coding` carries the
#      `module-vertical` tag (skipped by `architecture-layers`, which otherwise
#      flagged coding→router) and why `coding-no-composition-root` forbids only
#      the composition root, NOT the shared router. No forbid rule targets it.
#
#   2. usecases/coding_context → domain/introspection/privacy_guard
#      TYPE_CHECKING-only import (types, no runtime edge, no cycle). Not present
#      in `code_imports`, so it produces no depends_on edge and no finding. Legal
#      as a compile-time type reference to a shared domain value object.
#
#   3. adapters/indicator → infrastructure/telegram/gateway
#      TYPE_CHECKING-only cross-infra import (types only). Same as (2): no runtime
#      edge, no finding. Legal — the indicator adapter types against the gateway
#      protocol without a runtime dependency.
#
# If any of these ever becomes a RUNTIME import, it will surface (edge / import
# scan) and must be re-evaluated — do not pre-emptively suppress.
