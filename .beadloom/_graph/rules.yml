  # ── Graph-edge backstop: domain layer must not depend on a service ──────────
  - name: no-domain-depends-on-outer
    description: "Домен-слой не зависит от сервисов (runtime/bob), кроме part_of"
    severity: error
    deny:
      from: {kind: domain}
      to:   {kind: service}
      unless_edge: [part_of]

  # ── Coverage: every src module is a tracked node or explicitly exempt ───────
  - name: module-coverage
    description: "Каждый src/bob модуль — трекнутый узел (feature/component/source) или exempt"
    severity: error
    module_coverage:
      source_root: src/bob/
      min_symbols: 1
      exempt:
        - "**/__init__.py"
        - "**/__main__.py"
        - "**/py.typed"
        # BOB-065: single util, place in Phase 3 — reliability.py is one loose
        # application helper (call_with_retry). The `ports` package is now a
        # tracked feature node in services.yml, so its exempt line is gone; only
        # this single util remains uncovered. The rule STAYS error so any NEW
        # shadow module still fails.
        - "src/bob/application/reliability.py"  # BOB-065: single util, place in Phase 3

  # ── Anti-monster (ratchet: warn now → error after Фаза 3 decomposition) ─────
  - name: no-monster-modules
    description: "Модуль-слой/фича не должен пухнуть (handle_message/app.py/gateway — #9/#10/#25)"
    severity: warn
    check:
      for: {kind: feature}
      max_symbols: 200

# ── BOB-062.2: the temporary kernel → memory edge (allowed until slice .7) ────
# The memory domain-first move left exactly ONE deliberately-allowed backward
# reference (kernel → memory), documented here so a reviewer sees the reasoning
# and no rule is added that would mask a real break:
#
#   bob.infrastructure.persistence.sqlite_repo → bob.memory.entities
#     (TYPE_CHECKING-only: EpisodicEvent, SemanticFact)
#   # BOB-062.2: kernel→memory, temporary until slice .7 (SqliteMemoryRepo split)
#
# `SqliteMemoryRepo` is genuinely a MEMORY adapter, but it still lives inside the
# SHARED persistence kernel (one sqlite_repo.py + schema.sql feeding 13 other
# stores through the `.connection()` seam). Owner decision (variant C, 2026-07-23):
# memory takes its business logic NOW; the store kernel splits out in BOB-062.7,
# where `SqliteMemoryRepo` separates into a connection-kernel and a `MemoryRepo`
# implementation and this edge disappears.
#
# Why it needs NO allow-rule and produces NO finding (not suppressed — genuinely
# clean): (a) the import is TYPE_CHECKING-only, so it is ABSENT from `code_imports`
# — no `forbid_import` match, and no `depends_on` edge, hence no cycle with the
# memory→kernel type-refs (hybrid_recall/fts_recall → SqliteMemoryRepo); and
# (b) it targets `entities`, memory's PUBLIC domain surface — NOT `usecases/` or
# `adapters/`, which the boundary globs above are the only memory paths they
# forbid. If it ever becomes a RUNTIME import it will surface (import scan / edge)
# and must be re-evaluated at .7 — do NOT pre-emptively suppress it.

# ── BOB-062.1: 3 legalized cross-boundary refs for the `coding` module ────────
# The domain-first move surfaced three cross-boundary references. All THREE are
# legal by design (not real violations); they are documented here deliberately so
# a later reviewer sees the reasoning and no rule is added that would mask a real
# break. None currently produces a lint finding (see rationale per item):
#
#   1. usecases/classify_coding_intent → application/router/llm_router
#      app→app dependency on the SHARED LLM router. `llm_router` is a general
#      application-level service that lives OUTSIDE any vertical module (all
#      capabilities route through it). Legal. It is why `coding` carries the
#      `module-vertical` tag (skipped by `architecture-layers`, which otherwise
#      flagged coding→router) and why `coding-no-composition-root` forbids only
#      the composition root, NOT the shared router. No forbid rule targets it.
#
#   2. usecases/coding_context → domain/introspection/privacy_guard
#      TYPE_CHECKING-only import (types, no runtime edge, no cycle). Not present
#      in `code_imports`, so it produces no depends_on edge and no finding. Legal
#      as a compile-time type reference to a shared domain value object.
#
#   3. adapters/indicator → infrastructure/telegram/gateway
#      TYPE_CHECKING-only cross-infra import (types only). Same as (2): no runtime
#      edge, no finding. Legal — the indicator adapter types against the gateway
#      protocol without a runtime dependency.
#
# If any of these ever becomes a RUNTIME import, it will surface (edge / import
# scan) and must be re-evaluated — do not pre-emptively suppress.

# ── BOB-062.3: legalized cross-boundary refs for the `proactivity` module ─────
# The domain-first move surfaced these cross-boundary references (edge-inventory
# from slice .1). All are legal by design (not real violations); documented here
# so a later reviewer sees the reasoning and no rule is added that would mask a
# real break. None currently produces a lint finding (see rationale per item):
#
#   INBOUND (outside → proactivity) — all target the PUBLIC domain surface, so
#   the `proactivity-boundary-no-outside-{usecases,adapters}` globs (which forbid
#   only `usecases/`+`adapters/`) do NOT bite them:
#   1. application/usecases/handle_message → proactivity/self_improvement
#      RUNTIME import of RuleModulators/build_modulators (read-only behaviour
#      modulators). 🔴 personality-flow → proactivity.self_improvement stitch.
#      `self_improvement.py` is proactivity's public domain surface (root file),
#      NOT usecases/adapters. Legal.
#   2. infrastructure/telegram/guppi → proactivity/goals.state, /self_improvement,
#      /state   RUNTIME imports of GoalState/can_transition/RuleState/… (the /status
#      + /quiet + /wake UI renders proactivity domain state). 🔴 adapter reads the
#      proactivity DOMAIN surface — again root/`goals` value types, not usecases/
#      adapters. Legal.
#   3. guppi & multibot → proactivity/usecases/plan_goal (PlanGoal type)
#      TYPE_CHECKING-only — ABSENT from `code_imports`, so no forbid_import match
#      and no depends_on edge. Legal as a compile-time type reference even though
#      it names a usecase.
#   domain/ports/__init__ → proactivity/ports (5-Protocol shim re-export) is a
#   domain→module public-surface import (mirrors domain.ports→memory.ports); ports
#   are the module's declared inward seam — legal, no forbid targets it.
#
#   OUTBOUND (proactivity → outside):
#   4. usecases/engine, usecases/pursue_goals → memory/entities (EpisodicEvent)
#      🔴 proactivity → memory.entities. RUNTIME, but `entities` is memory's PUBLIC
#      domain surface (NOT memory/usecases|adapters — the only memory paths the
#      boundary globs forbid), so no finding. App-layer usecases legitimately read
#      a shared domain value type. Legal.
#   5. usecases/engine, usecases/plan_goal → application/router.llm_router,
#      reply_tier_selector; usecases → domain/personality.{conversation,voice,…};
#      proactivity.* → domain/ports (Clock/Planner/MemoryRecall). SHARED
#      application/domain services OUTSIDE any module — target `bob/application/*`
#      or `bob/domain/*`, never `bob/infrastructure/*`, so `usecases-no-infra`
#      stays clean and `no-composition-root` (exact `bob/app`) does not match.
#   6. adapters/* → kernel connection: NO import — SqliteMemoryRepo is INJECTED at
#      the composition root (app.py) via constructors; `proactivity_sources` imports
#      only `bob.domain.ports.Clock` (TYPE). So there is NO proactivity→kernel edge,
#      and — confirmed from .1 — NO reverse kernel→proactivity edge either
#      (sqlite_repo/schema.sql do not import the 4 stores). No allow-rule needed.
#
# If any TYPE_CHECKING item ever becomes a RUNTIME import it will surface (edge /
# import scan) and must be re-evaluated — do not pre-emptively suppress.

# ── 🔴 BOUNDARY-RULE GENERATOR — IMPLEMENTED in BOB-062.4 (.1) ─────────────────
# STATUS: the proposal below is now BUILT — `scripts/gen_boundary_rules.py` emits
# the explicit-path boundary rules into the `# BEGIN/END generated boundary rules`
# region above (converting coding/memory/proactivity off char-classes and adding
# `internals-no-adapters` to all three). CI runs `--check` for idempotency. The
# original evaluation is kept below as the design rationale (history).
#
# Signal (review .1/.2, re-confirmed .3): module isolation is expressed by MANUAL
# single-char-class globs (`[acdim]*`, one letter per module). Every new vertical
# forces editing the char-class of EVERY existing module's two boundary rules —
# 2·(N−1) hand-edits per slice, silent-gap-prone if one is missed.
#
# DECISION: variant B (a generator) is justified IN PRINCIPLE, but NOT built in
# this slice, and a naive char-class generator would be WRONG. Reasons:
#   • 🔴 SINGLE-CHAR COLLISION (hard blocker, lands at .4): `capabilities` also
#     starts with `c`, like `coding`. A single-char class CANNOT isolate two
#     modules that share a first letter — coding's self-exclusion (`[!c]`/omitting
#     `c`) would ALSO exclude capabilities, leaving coding↔capabilities mutual
#     isolation UNENFORCEABLE. So the scheme itself must move to EXPLICIT per-module
#     path globs (`src/bob/coding/`, `src/bob/capabilities/`) — a generator that
#     merely emits char-classes would inherit the bug.
#   • This rules.yml is deliberately RICH with hand-authored rationale comments
#     (the point of AaC review). A generator that OVERWRITES the file would destroy
#     them; a prose-preserving round-trip (ruamel) is >>60 lines and risky — it
#     would BLOAT this migration slice.
#
# PROPOSED for .4 (design, NOT implemented here to avoid mixing generator infra
# into the move):
#   `scripts/gen_boundary_rules.py` — reads services.yml, selects nodes tagged
#   `module-vertical`, and for each module M emits the 5–6 forbid_import rules
#   with EXPLICIT paths (no char classes):
#       for M in modules:
#         emit usecases-no-adapters, internals-no-usecases (with `[!u]*` iff
#           M/usecases/__init__ re-exports), usecases-no-infra, no-composition-root
#         for the inward boundary, source = every OTHER module's path, listed
#           explicitly: from ∈ {src/bob/<other>/ …} — one forbid per (M, other)
#           pair OR a comment-documented multi-line list — killing the char-class
#           correlation entirely and dodging the c-collision.
#   Emit to a GENERATED region (marker-delimited) that a small `--check` mode
#   verifies is in sync in CI, leaving the hand-written rationale blocks untouched.
#   Est. ~50–70 lines. Owner/reviewer verdict requested at .4 (capabilities) —
#   that slice is where the char-class scheme first BREAKS, so it is the natural
#   forcing point to land the generator + convert coding/memory/proactivity globs.
