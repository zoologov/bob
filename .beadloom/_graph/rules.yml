# ── BOB-062.4: cross-boundary refs for the `capabilities` module ──────────────
# The domain-first move of capabilities (slice .2 edge-inventory) surfaced these
# cross-boundary references. The generated `capabilities-*` boundary rules above now
# ENFORCE the module seam (explicit-path, c/c-collision-proof). Splitting the refs
# into two groups by whether the generated rules find them CLEAN or FLAG them:
#
# ── GROUP A — genuinely CLEAN (no finding; documented so a rule is not added that
#    would mask a real break) ──
#   A1. coding/usecases/coding_context → capabilities.introspection.privacy_guard
#       (PrivacyGuard). TYPE_CHECKING-only — ABSENT from `code_imports`, so no
#       `forbid_import` match and no depends_on edge. Carried-over coding→introspection
#       TC ref from BOB-062.1 item (2), retargeted to the capabilities surface. Legal
#       (compile-time type ref); names the module ROOT surface, not usecases/adapters.
#   A2. domain/ports/__init__ → capabilities.ports (18-port shim re-export). A
#       domain→module public-surface import (mirrors domain.ports→memory.ports and
#       →proactivity.ports); ports are the module's declared inward seam — no forbid
#       targets it. (This one-way shim leg is fine on its own — the return runtime
#       edge that used to close it into a cycle was removed in B4 below.)
#   A3. capabilities/usecases → application.reliability (call_with_retry). SHARED
#       app-level service OUTSIDE any vertical module (same status as the shared
#       llm_router in BOB-062.1 item 1). Targets `bob/application/*`, never
#       `bob/infrastructure/*`, so `capabilities-usecases-no-infra` stays clean and
#       `capabilities-no-composition-root` (exact `bob/app`) does not match. Legal.
#
# ── GROUP B — RUNTIME refs the .3 rules flagged, now RESOLVED in slice .7 (a note
#    block cannot legalize them: `forbid_import` has NO allow-list, and the cycle
#    rule is import-derived — so each was fixed at its source). Kept as a resolution
#    record so the reasoning is not lost: ──
