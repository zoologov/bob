  # source и вложенный узел дал бы двойной учёт), и развести его — архитектурное решение
  # уровня owner'а, а не побочный эффект dev-среза.
  #
  # Бюджет 230 с малым запасом: ещё ~18 символов, и правило снова падает, требуя честного
  # пере-скоупинга. Это СИГНАЛ, а не цель.
  #
  # 🔴 ПРИЁМКА BOB-092 ОБЯЗАНА СНЯТЬ ДВЕ ЗАПИСИ, А НЕ ОДНУ (ревью BOB-091.3, Minor-4):
  # это правило И `exclude: [capabilities]` в общем `no-monster-modules` выше. Если убрать
  # только персональное правило, узел останется БЕЗ ЛЮБОГО ограничения размера — то есть
  # ослабление гейта будет выглядеть как его закрытие.
  - name: no-monster-modules-capabilities
    description: "capabilities: отдельный явный бюджет + долг на разделение узла (BOB-091.2, Issues #44)"
    severity: error
    check:
      for: {ref_id: capabilities}
      max_symbols: 230

# ── BOB-062.7b: the kernel → memory edge is GONE (SqliteMemoryRepo split) ─────
# HISTORY (.2→.7b): the memory domain-first move (.2) left exactly ONE
# deliberately-allowed backward reference — the shared persistence kernel
# `sqlite_repo.py` type-referenced `bob.memory.entities` (EpisodicEvent,
# SemanticFact, TYPE_CHECKING-only) because `SqliteMemoryRepo` still lived inside
# that shared kernel. Owner decision (variant C, 2026-07-23) deferred the split to
# BOB-062.7. That split has now LANDED (.7):
#
#   • connection-kernel  → src/bob/infrastructure/persistence/connection.py
#       (`SqliteConnection`: open/WAL/foreign_keys/sqlite-vec load/schema.sql/kv/
#        close — pure I/O, NO memory logic, NO domain entities).
#   • memory realisation → src/bob/memory/adapters/sqlite_memory_repo.py
#       (`SqliteMemoryRepo`: episodic/semantic/consolidation/dedup/vector; owns
#        EpisodicEvent/SemanticFact INTERNALLY now).
#
# So the old `kernel → memory.entities` edge no longer exists — the kernel carries
# no memory types at all (verified: `grep memory connection.py` = docstrings only,
# no import). NO allow-rule / note is needed for it any more.
#
# The two remaining, LEGAL persistence edges after the split (documented so a
# reviewer sees the reasoning and no rule masks a real break):
#
#   1. bob.memory.adapters.sqlite_memory_repo → bob.infrastructure.persistence.connection
#      RUNTIME import of `SqliteConnection`. This is a memory ADAPTER reaching
#      OUTWARD to the shared infra kernel — the correct direction (adapter → infra),
#      NOT a backward kernel→memory edge. No cycle: the kernel imports nothing back.
#
#   2. the 13 per-module durable stores  → the `SqliteConnection` seam
#      NO import edge at all — the connection is INJECTED at composition (each store
#      types against a structural `connection` Protocol / accepts the kernel in its
#      ctor). 0 import-rules needed; 0 findings.
#
# The persistence facade (`infrastructure/persistence/__init__.py`) now re-exports
# ONLY `SqliteConnection` (.7b): the stale re-exports of stores that had migrated
# to social/personality/conversation/proactivity adapters (.2–.6) were removed,
# which also broke the latent `social ↔ persistence` facade cycle (persistence
# re-exported `social.adapters.*` while `social/adapters/soul_loader` imported
# `SoulStore` back through the facade). Every importer was repointed to the
# owning-module canon path.

# ── BOB-062.1: 3 legalized cross-boundary refs for the `coding` module ────────
# The domain-first move surfaced three cross-boundary references. All THREE are
# legal by design (not real violations); they are documented here deliberately so
# a later reviewer sees the reasoning and no rule is added that would mask a real
# break. None currently produces a lint finding (see rationale per item):
#
#   1. usecases/classify_coding_intent → application/router/llm_router
#      app→app dependency on the SHARED LLM router. `llm_router` is a general
#      application-level service that lives OUTSIDE any vertical module (all
#      capabilities route through it). Legal. It is why `coding` carries the
#      `module-vertical` tag (skipped by `architecture-layers`, which otherwise
#      flagged coding→router) and why `coding-no-composition-root` forbids only
#      the composition root, NOT the shared router. No forbid rule targets it.
#
#   2. usecases/coding_context → domain/introspection/privacy_guard
#      TYPE_CHECKING-only import (types, no runtime edge, no cycle). Not present
#      in `code_imports`, so it produces no depends_on edge and no finding. Legal
#      as a compile-time type reference to a shared domain value object.
#
#   3. adapters/indicator → infrastructure/telegram/gateway
#      TYPE_CHECKING-only cross-infra import (types only). Same as (2): no runtime
#      edge, no finding. Legal — the indicator adapter types against the gateway
#      protocol without a runtime dependency.
#
# If any of these ever becomes a RUNTIME import, it will surface (edge / import
# scan) and must be re-evaluated — do not pre-emptively suppress.

# ── BOB-087.E (bob-6u2): the DELIBERATE `interactive → coding` edge ───────────
# Слайс E развёл ЖИВОЙ ИНТЕРАКТИВНЫЙ ТЕРМИНАЛ в собственный узел `interactive`
# (src/bob/interactive/). Появилось одно новое межмодульное ребро — `interactive →
# coding` — и оно РАЗРЕШЕНО СОЗНАТЕЛЬНО, вот на каком основании.
#
# ЧТО ИМЕННО импортируется (полный список, ничего сверх него): общая ДОМЕННАЯ
# поверхность coding-сессии —
#   • bob.coding.entities   — CodingSession (запись сессии) + CodingOutcome (итог хода);
#   • bob.coding.ports      — Worktree / CodingSessionStore / InteractiveRunner /
#                             PersistentWorkspace / ResumableSessionLookup /
#                             OwnerCheck / OwnerNotifier / LiveRunStreamer;
#   • bob.coding.state      — машина состояний сессии (INTERACTIVE/CANCELLED, is_terminal);
#   • bob.coding.naming     — worktree_branch / workspace_branch (безопасные имена веток);
#   • bob.coding.sandbox_policy — allowlist --permission-mode + ClaudeRunError;
#   • bob.coding.push_guard — guarded_spawn_env (барьер сетевого push);
#   • bob.coding.stream_json — parse_event / STREAM_LIMIT (формат потока claude);
#   • bob.coding.session_voice — ровно две ОБЩИЕ реплики управления сессией
#                             (`stopped`, `no_session`), ре-экспортируемые
#                             bob.interactive.voice.
#
# ПОЧЕМУ это законно, а не «дырка для удобства»:
#   1. Направление к ЯДРУ, а не к оркестратору. Импортируется только КОРЕНЬ модуля
#      coding (домен + порты). Ни одного импорта из `coding/usecases/*` или
#      `coding/adapters/*` — это ЗАПРЕЩЕНО генерируемыми правилами
#      `coding-boundary-no-interactive-{usecases,adapters}`, и запрет реально бьёт:
#      чтобы его соблюсти, в этом же срезе CodingOutcome переехал в `entities`, три
#      общих порта — в `ports`, разбор stream-json — в `stream_json`, а ClaudeRunError —
#      к политике, которая отказывает (`sandbox_policy`). То есть правило не обошли,
#      а выполнили — ценой честного перемещения общих контрактов на общую поверхность.
#   2. Ребро ОДНОСТОРОННЕЕ и таким останется структурно: `coding` не импортирует
#      `interactive` НИГДЕ, а его usecases/adapters закрыты симметричными
#      `interactive-boundary-no-coding-*`. Цикла нет (`no-dependency-cycles` — error).
#   3. Альтернатива была бы ХУЖЕ. Дублировать CodingSession/состояния/имена веток в
#      двух контекстах — значит завести ВТОРУЮ правду про одну и ту же строку в БД и
#      одно и то же рабочее дерево (расхождение = потерянные сессии). Вынести всё
#      общее в `kernel` тоже нельзя: kernel — инфра-нейтральные контракты ВСЕГО Боба,
#      а это словарь ОДНОЙ предметной области («сессия claude в worktree»).
#      Правильная фигура — общий bounded context (`coding`) и надстроенный над ним
#      второй (`interactive`), а не третий «shared»-модуль-свалка.
#
# 🔴 Красная черта на будущее: если `interactive` когда-нибудь потянет что-то из
# `coding/usecases` или `coding/adapters` — это НЕ повод расширить исключение, а
# сигнал, что общий контракт снова оказался не на общей поверхности: его надо
# опустить в `entities`/`ports`/политику, как сделано здесь.

