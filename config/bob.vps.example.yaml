# config/bob.vps.example.yaml — указатель (BOB-116).
#
# Раньше здесь лежал перечень отличий конфига VPS от config/bob.example.yaml (BOB-094), а
# сам конфиг жил только на сервере. С BOB-116 полный конфиг прода трекается в
# config/bob.vps.yaml: деплой копирует его в /opt/bob/config/bob.yaml и сверяет sha256.
# Идентификаторы и секреты — только в /opt/bob/.env; их список — в шапке config/bob.vps.yaml.
#
# Этот файл не читается ни Бобом, ни деплоем и оставлен, чтобы прежняя ссылка вела к
# действующему источнику.
