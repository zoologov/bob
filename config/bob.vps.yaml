#
# config/bob.vps.yaml — ПОЛНЫЙ конфиг Боба на VPS (BOB-116), трекаемый в репозитории.
#
# Деплой копирует этот файл в /opt/bob/config/bob.yaml и сверяет sha256 обоих: действующий
# конфиг на сервере равен репозиторию. Правка конфига прода — это коммит сюда, а не правка
# на сервере. Порядок слоёв прежний: встроенные дефолты <- этот файл <- окружение.
#
# 🔴 Репозиторий ПУБЛИЧНЫЙ. Здесь нет ни секретов, ни идентификаторов — ни значением, ни в
# комментарии. Их держит только /opt/bob/.env (600, владелец bob), и в конфиг они попадают
# через окружение: BOB_<секция>__<ключ>, вложенность — двойным подчёркиванием, регистр
# любой. Лоадер приводит значение к типу дефолта: id — int, список — числа через запятую.
# Гард: tests/infrastructure/config/test_vps_config_is_clean.py.
#
# Обязательные переменные /opt/bob/.env:
#   BOB_TELEGRAM__CHAT_ID           -> telegram.chat_id         (id группы, int)
#   BOB_TELEGRAM__OWNER_ID          -> telegram.owner_id        (id владельца, int)
#   BOB_TELEGRAM__ALLOWED_CHAT_IDS  -> telegram.allowed_chat_ids (id через запятую)
#   BOB_TELEGRAM__BOB__TOPIC_ID     -> telegram.bob.topic_id    (топик Боба, int)
#   BOB_TELEGRAM__TOKEN             -> telegram.bob.token       (явное отображение)
#   GUPPI_TELEGRAM__TOKEN           -> telegram.guppi.token     (префикс без BOB_)
#   BOB_LLM__TIER0_API_KEY          -> llm.tier0_api_key
#   BOB_LLM__TIER1_API_KEY          -> llm.tier1_api_key
# Необязательные:
#   BOB_TELEGRAM__OWNER_NAME        -> telegram.owner_name      (имя для бэкфилла BOB-045)
#   BOB_TELEGRAM__OWNER_ADDRESS     -> telegram.owner_address   (обращение в сигналах, BOB-126;
#                                      пусто — первое слово owner_name)
#   BOB_TELEGRAM__OWNER_DM_CHAT_ID  -> telegram.owner_dm_chat_id (по умолчанию = owner_id)

runtime:
  log_level: INFO
  heartbeat_seconds: 30
  # BOB-103: приложение само владеет логом и ротирует его по размеру.
  log_file: logs/bob.log
  log_max_bytes: 33554432      # 32 MiB на файл до ротации
  log_backup_count: 5
  # BOB-094: Боб объявляет уход на обновление и возвращение при рестарте.
  restart_notice: true

llm:
  # Tier-0 и Tier-1 — облако Qwen (Alibaba Model Studio, сингапурский регион).
  tier0_base_url: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
  tier0_model: qwen3.6-flash
  tier1_base_url: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
  tier1_model: qwen3.7-plus
  timeout_seconds: 180
  disable_thinking: true
  # BOB-072: потолок одновременных вызовов Tier-1.
  tier1_max_concurrency: 4
  # Аварийный дублёр Tier-0 на локальном Ollama. Пустое значение = выключен.
  # ВКЛЮЧЁН 2026-10-22 (BOB-126, решение владельца по замеру BOB-123 на этом VPS, 4 vCPU без GPU):
  #   qwen3.5:4b, тёплая модель — классификатор 1.3 с, монолог 24 с, рефлексия 15 с;
  #              холодная     — 16 с, 73 с и 169 с: без keep-alive дверь после простоя
  #              платит загрузку, поэтому deploy/ollama-keep-alive.conf держит модели в памяти;
  #   память     — qwen3.5:4b 3.1 ГБ + bge-m3 1.2 ГБ живут рядом без вытеснения;
  #   генерация  — 4.5 ток/с, русский связный, в характере.
  # 🔴 Не больше двух моделей на этой RAM: третья рядом дала OOM-kill llama-server (22.10);
  #    OLLAMA_MAX_LOADED_MODELS=2 в том же drop-in. Прежний замер D9 (BOB-116, 2026-10-21):
  #    qwen3:8b 5.9 ГБ не помещался рядом с bge-m3 и не проходил пороги холодным.
  # Выключить: tier0_fallback: "" здесь, коммит и новый тег (deploy/RUNBOOK.md §11).
  tier0_fallback: ollama
  tier0_fallback_base_url: http://localhost:11434/v1
  tier0_fallback_model: qwen3.5:4b
  # Здоровье провайдера (BOB-116): дефолты лоадера, выписанные явно.
  health:
    failures_threshold: 5            # отказов подряд до «провайдер лёг»
    duration_threshold_seconds: 180  # или столько секунд отказов подряд, что раньше
    reminders_seconds: [600, 3600, 21600, 86400]  # напоминания владельцу, последний повторяется
    probe_seconds: [60, 120, 300]    # зонд лёгшего провайдера, последний повторяется
    owner_alert: true                # сигнал владельцу в личку; false — только лог

embeddings:
  # Локальный Ollama на VPS ради эмбеддера (bge-m3, 1024-dim).
  base_url: http://localhost:11434
  model: bge-m3
  dim: 1024

telegram:
  poll_timeout: 10
  # BOB-094: столько неудачных поллингов подряд считаются «оглох» (диагноз в лог).
  outage_threshold: 5
  # chat_id, owner_id, allowed_chat_ids, bob.topic_id, owner_dm_chat_id, owner_name,
  # owner_address и оба токена — только из /opt/bob/.env (список в шапке).

memory:
  # BOB-079: Боб пишет свои действия от первого лица; с BOB-116 — и эпизод «я молчал» после
  # простоя LLM. Q5 RFC BOB-116 решён: на VPS 2026-10-21 прочитано true, и трекаемый файл
  # его сохраняет — без этой строки выкатка выключила бы автобиографию на проде.
  autobiography: true
  origin_provenance: true     # BOB-087.C: провенанс против конфабуляции
  register_recall: true       # BOB-087.C: register-aware recall
  work_journal: true          # BOB-087.B
  consolidation:
    enabled: true
    batch_size: 50
    max_age_days: 14
  dedup:
    enabled: true
    batch_size: 200
    threshold: 0.92
  surface_old:
    freq: 0.15

# ---------------------------------------------------------------------------------------------
# Ниже — настройки, которые рукописный конфиг прода задавал до BOB-116 (compare-keys при миграции
# 2026-10-22: 41 ключ). Значения перенесены как есть; без них выкатка молча вернула бы дефолты
# и выключила бы способности (RUNBOOK §9.2 п.3). Секретов и идентификаторов здесь нет.
# ---------------------------------------------------------------------------------------------

persistence:
  db_path: data/bob.db
  soul_dir: data/soul

genesis:
  templates_dir: bob-soul

dialogue:
  intake_debounce_ms: 600

diagrams:
  mmdc_bin: /usr/local/bin/mmdc

coder:
  enabled: true
  dev_dm: true                # BOB-082: dev-канал в личке
  interactive: true           # BOB-083: интерактивный терминал
  isolated_clone: true
  permission_mode: acceptEdits
  stream_via_guppi: true      # BOB-087: стрим через GUPPI
  timeout: 600

introspection:
  enabled: true
  dev_tools: true             # BOB-081
  architecture_tools: true    # BOB-091

presence:
  reflective: true
  stream_read: true           # BOB-072
  catchup:
    enabled: true
  endorsement:
    enabled: true
  rhythm:
    enabled: true
  room_mood:
    enabled: true
  series_budget:
    enabled: true
  staleness:
    enabled: true
  tact:
    enabled: true

social:
  delivery: true
  roster: true                # BOB-080

self_improvement:
  enabled: true
  detect_cadence: 20          # мёртвый ключ до BOB-120 (Issues #67) — значение прода сохранено
  detector_tier: 1
  max_active_rules: 5
  max_magnitude: 0.3
