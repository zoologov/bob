  # 🔴 КУДА ВЕДЁТ ССЫЛКА НА PR — ключа здесь НЕТ (bob-a6b.9). Апстрим называет
  # `github.propose_repo` (ниже) — та же секция и тот же слаг, которым Боб читает апстрим.
  # Раньше это же было продублировано как `coder.upstream_repo`; дубль убран, потому что два
  # ключа на один факт однажды разъезжаются, и тогда ссылка ведёт в один репозиторий, а права
  # у Боба к другому. Один факт заполняется в одном месте.

# 🔴 GITHUB-ИДЕНТИЧНОСТЬ БОБА (BOB-089, срез B) — «кем он представляется и чем
# аутентифицируется». Всё пусто по умолчанию: без реквизитов механизм инертен, а отказ
# приходит с ИМЕНЕМ недостающего ключа в тот момент, когда токен реально понадобился.
#
# Принципалов ДВА, потому что права GitHub App одинаковы для ВСЕХ его установок — сузить
# их «для этого репозитория» нельзя:
#   work    — «Bob AI Work» (contents write), установлен ТОЛЬКО на организацию с приватным
#             форком: этим Боб пушит свою ветку и физически не может записать в апстрим;
#   propose — «Bob AI Propose» (contents READ + pull_requests write): этим читается
#             апстрим. Негативный смоук: создание ветки / force-push в main / запись файла
#             в апстрим — все три 403 «Resource not accessible by integration».
#
# 🔴 ЭТА СЕКЦИЯ — ЕДИНСТВЕННЫЙ ИСТОЧНИК РЕПОЗИТОРНОЙ ИДЕНТИЧНОСТИ (bob-a6b.9): `work_repo`
# — форк Боба, `propose_repo` — твой апстрим. Значит, `propose_repo` заодно и цель ссылки на
# создание PR: когда работа готова, Боб НЕ открывает PR (cross-repo PR из приватного форка
# installation-токену недоступен — проверено три способа, обход не ищем), а говорит, что
# работа лежит в его форке, и даёт предзаполненную форму
# `https://github.com/<propose_repo>/compare/main...<форк>:<ветка>?expand=1`, где ты жмёшь
# «Create pull request». Пусто (или нет форка / нет клона) → прежний путь `gh pr create`.
#
# 🔴 СЕКРЕТЫ СЮДА НЕ КЛАДУТСЯ. `*_app_key` — это ПУТЬ к приватному ключу (0600), а НЕ его
# содержимое: содержимое уехало бы в argv openssl, а argv виден в `ps` любому процессу
# пользователя (такая конфигурация отвергается громко). Значения удобнее держать в .env, а
# не в этом файле:
#   BOB_GITHUB__WORK_APP_ID / __WORK_APP_KEY / __WORK_REPO
#   BOB_GITHUB__PROPOSE_APP_ID / __PROPOSE_APP_KEY / __PROPOSE_REPO
#
# 🔴 ГДЕ ДЕРЖАТЬ САМ КЛЮЧ: ВНЕ дерева репозитория — `~/.config/bob/secrets/` (каталог 0700,
# файлы 0600). Внутри репозитория его достаёт и `read_code`, и `git add` (bob-zmp), поэтому
# абсолютный путь тут — не экзотика, а штатная форма. Правило чтения пути одно (bob-a6b.15):
# АБСОЛЮТНЫЙ путь и путь с `~` берутся КАК ЕСТЬ, ОТНОСИТЕЛЬНЫЙ читается от корня проекта (а
# не от каталога, из которого запущен процесс). Приклеивать корень самому НЕ надо: значение
# `<корень>/Users/…/secrets/key.pem` — это ровно тот дефект, из-за которого подпись падала.
# github:
#   work_app_id: ""            # числовой app_id (уезжает в claim `iss` App-JWT)
#   work_app_key: ""           # ~/.config/bob/secrets/bob-ai-work.private-key.pem
#   work_repo: ""              # owner/repo форка — по нему находится установка принципала;
#                              # обязан совпадать с репозиторием в `coder.fork_url`
#   propose_app_id: ""
#   propose_app_key: ""        # ~/.config/bob/secrets/bob-ai-propose.private-key.pem
#   propose_repo: ""           # owner/repo апстрима — он же цель ссылки на создание PR
#   # 🔴 Обновление ЗАРАНЕЕ, а не по факту 401: installation-токен живёт час, а сессия
#   # кодера бывает длиннее, и обрыв посреди работы обошёлся бы дороже лишнего минта.
#   # За столько секунд до конца токен считается негодным.
#   token_margin_seconds: 300
#   # Время жизни App-JWT: с запасом внутри десятиминутного предела GitHub.
#   jwt_lifetime_seconds: 480
#   api_base_url: "https://api.github.com"
#   openssl_bin: "openssl"     # подпись RS256 без новых зависимостей (PyJWT в проекте нет)
#   timeout_seconds: 30
