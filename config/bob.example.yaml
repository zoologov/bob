  # 🔴 РАБОЧЕЕ МЕСТО — ОТДЕЛЬНЫЙ КЛОН, А НЕ LINKED WORKTREE (BOB-089, срез A). ДЕФОЛТ — ON.
  # Зачем: linked worktree делит `.git` с основным репозиторием — те же объекты, те же
  # REFS, те же remotes и те же credentials. Проверено на настоящем git: из такого дерева
  # `git update-ref refs/heads/main <sha>` двигает main БЕЗ сети, БЕЗ кредов и мимо любого
  # push-барьера. ON → Боб работает в клоне со СВОИМ `.git`, и этой дороги нет вовсе;
  # приватность та же (в клоне только трекнутые файлы — доказано тестом на настоящем git).
  # 🔴 Честная рамка: этот же флаг включает И изоляцию окружения спавна (срез C) — клон
