#
# Example Bob configuration. Copy to config/bob.yaml and fill in.
# Precedence: built-in defaults <- this YAML <- environment (BOB_* with __ nesting,
# e.g. BOB_LLM__TIER1_API_KEY). An env value takes the type of the built-in default at
# its path: int, float, bool (true/false, 1/0, yes/no, on/off), a comma-separated list
# (BOB_TELEGRAM__ALLOWED_CHAT_IDS=-1001234567890,-1009876543210 — placeholders); a value
# that does not fit stops the start with an error naming the variable. The production
# config is config/bob.vps.yaml.
#
# SECRETS (the two bot tokens, llm.tier1_api_key) — prefer environment variables
# over committing them here. Never commit a real token/key. The bot tokens are
# env-only via an EXPLICIT mapping (not the generic BOB_ nesting):
#   BOB_TELEGRAM__TOKEN    -> telegram.bob.token
#   GUPPI_TELEGRAM__TOKEN  -> telegram.guppi.token   (non-standard prefix)

runtime:
  log_level: INFO
  heartbeat_seconds: 30        # cadence of the inner-monologue / reflect heartbeat
  # BOB-103: приложение САМО владеет рабочим логом (RotatingFileHandler), а не
  # shell-редирект лаунчера — иначе лог рос без предела (замерено 2.7 ГБ). Задай
  # log_file, чтобы включить ротацию по размеру; ./bob указывает logs/bob.log.
  # Без log_file — вывод в stderr (тест/ad-hoc), без ротации.
  log_file: logs/bob.log
  log_max_bytes: 33554432      # 32 MiB на файл до ротации
  log_backup_count: 5          # хранить 5 ротированных файлов (~160 MiB потолок)
  # BOB-094: человечное объявление рестарта голосом Боба. ON → перед остановкой
  # (graceful-shutdown при systemctl restart) Боб предупреждает owner'а И группу
  # «ухожу обновиться», а после старта, если прошлый выход был апдейт-остановкой
  # (маркер в kv), говорит «вернулся, обновился». Отправка с таймаутом, не блокирует
  # завершение (сеть легла → молча выходим). Упал сам (нет маркера) → не притворяется
  # апдейтом. Default OFF → поведение lifecycle байт-в-байт прежнее. На VPS — ON.
  restart_notice: false

llm:
  # Tier 0 — local mlx-lm server (no API key): cheap, privacy-sensitive work.
  tier0_base_url: http://localhost:8080/v1
  tier0_model: qwen2.5:0.5b
  # tier0_api_key: ""          # optional; set via BOB_LLM__TIER0_API_KEY.
  #                            # Leave unset for keyless local mlx; only needed
  #                            # when Tier 0 is a keyed/remote endpoint.
  # Tier 1 — Qwen API (bearer key): quality-critical, user-facing replies.
  tier1_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  tier1_model: qwen2.5:7b
  tier1_api_key: ""            # set via BOB_LLM__TIER1_API_KEY, not here
  # Provider timeout (seconds). Tier 1 reasoning models can spend 1000+ tokens
  # on reasoning per reply; 60s is too low and causes spurious Tier 0 fallback.
  timeout_seconds: 180
  # Disable qwen3 "thinking" for replies (extra_body/chat_template_kwargs
  # enable_thinking=false). Cheaper + faster, and avoids the empty-content case
  # where a reasoning model spends its whole budget on reasoning_content.
  disable_thinking: true
  # Tier-1 rate-cap (BOB-072). A ceiling on CONCURRENT Tier-1 (Qwen API) completions —
  # invisible insurance against 429/degradation when bursts across chats (incl. the
  # holistic batch ROOM_READ behind presence.stream_read) hit Tier 1 at once. It only
  # SERIALIZES calls; it never touches the routing decision or the payload, and the
  # Tier 1 → Tier 0 fallback runs OUTSIDE the cap. Absent / 0 → no cap → byte-identical.
  # tier1_max_concurrency: 4

  # Аварийный дублёр Tier-0 на ЛОКАЛЬНОЙ модели (BOB-087.E, BOB-Issues #34). Облачный
  # Tier-0 отваливается пачками, и своего фолбэка у него не было — отвал уносил
  # классификаторы, монолог и гейты кодера. Пусто (дефолт) → выключено, сборка провайдеров
  # байт-в-байт прежняя. Значение `ollama` → Tier-0 собирается композитом.
  # Уходим на локальную модель ТОЛЬКО при транспортном отказе (таймаут, обрыв, DNS, 5xx,
  # 408/429). Прочие 4xx, битая форма ответа и программные ошибки идут наружу как ошибка:
  # фолбэк, срабатывающий на нашем же дефекте, не добавляет устойчивости — он прячет дефект.
  # 🔴 Направление зависит от ВИДА работы, а не от тира (E-M1): служебный ход деградирует
  # вниз, на дублёра; ход ГОЛОСОМ БОБА эскалируется ВВЕРХ на Tier-1, а если и там пусто —
  # за Боба не отвечает никто. Реплика, собранная слабой моделью, ушла бы в чат как его
  # голос, легла в память и правила бы тон уже после аварии.
  # Перед включением: локальная модель должна быть скачана (`ollama pull qwen2.5:0.5b`),
  # иначе аварийный путь лишь добавит вторую неудачную попытку — и ещё одно ожидание,
  # потому что дублёр наследует общий timeout_seconds.
  # tier0_fallback: ollama
  # tier0_fallback_base_url: http://localhost:11434/v1
  # tier0_fallback_model: qwen2.5:0.5b

  # Здоровье провайдера (BOB-116). Боб был нем десять дней на 403 облачного Tier-0, и об
  # этом знал только лог. Провайдер, который отказывает подряд, объявляется лёгшим по
  # числу отказов ИЛИ по их длительности — что наступит раньше; владелец получает один
  # сигнал в личку, затем напоминания по расписанию (последний интервал повторяется), а
  # лёгший провайдер проверяется зондом по своему расписанию. Значения ниже — дефолты
  # лоадера; блок можно не писать вовсе. Из окружения: BOB_LLM__HEALTH__OWNER_ALERT=false,
  # BOB_LLM__HEALTH__PROBE_SECONDS=60,120,300 — значение приводится к типу дефолта.
  health:
    failures_threshold: 5            # отказов подряд до «провайдер лёг»
    duration_threshold_seconds: 180  # или столько секунд отказов подряд
    reminders_seconds: [600, 3600, 21600, 86400]  # 10 мин, 1 ч, 6 ч, затем раз в сутки
    probe_seconds: [60, 120, 300]    # зонд: 1 мин, 2 мин, затем раз в 5 мин
    owner_alert: true                # false — только строка в логе, без сообщения владельцу

# memory:
  # Рабочая память dev-действий + защита личного общения от её протечки (BOB-087.B+C).
  # 🔴 Включать ТОЛЬКО парой: work_journal пишет эпизоды event_type='work' (дистиллированные
  # факты работы, не сырой firehose), register_recall приглушает их в casual-регистре
  # (down-weight, НЕ вырезание — память сквозная, Боб один разум) и поднимает в dev-контексте
  # или на прямой вопрос. Письмо без фильтра = работа течёт в личное общение; фильтр без
  # письма = no-op. Оба выключены по умолчанию.
  # work_journal: true
  # register_recall: true
  #
  # Провенанс «где это было» (BOB-090.C1). Боб не знал, где он говорил, и домысливал
  # место: в группе заявил «я объяснил Норману в группе», хотя объяснял в личке. Метка
  # источника (личка / общий чат) в память писалась и раньше — до промпта она просто не
  # доходила. Флаг доносит её как пометку к припомненному, чтобы Боб мог честно сказать
  # «это мы обсуждали в личке» — и, главное, перестал утверждать обратное.
  # 🔴 Это СИГНАЛ ДЛЯ СУЖДЕНИЯ, а не фильтр: память остаётся сквозной (BOB-082), ничего
  # из выдачи не вырезается. Ось «где сказано» ортогональна оси регистра «про что» выше.
  # Неизвестный источник (старые записи без метки) не называется вовсе — выдуманное
  # место хуже отсутствующего. Выключено по умолчанию; OFF → промпт байт-в-байт.
  # origin_provenance: true

# 🔴 Секция закомментирована ЦЕЛИКОМ намеренно: пустая секция в YAML читается как null и
# валит загрузчик (наступали на это в BOB-087). Раскомментируйте вместе с ключом.
# social:
  # Инструмент отправки в указанный чат/топик (BOB-090.B1). Без него исходящего адреса
  # не существует как понятия: ответ всегда уходит туда, откуда пришёл ход, поэтому
  # просьба из лички «расскажи Норману в нашей группе» невыполнима — Боб отвечает в личку.
  # ON → Боб может написать в известный чат ПО ПРОСЬБЕ owner'а: инструмент виден модели,
  # а решают чистые ядра — адрес (при неоднозначности переспросить, не угадывать), гейт
  # переноса приватного (по МАТЕРИАЛУ, который Боб добавляет от себя: приватный эпизод из
  # памяти уезжает в публичный чат только с явным согласием owner'а на этот ход; прямое
  # распоряжение owner'а — волеизъявление, согласие содержится в самой команде) и
  # заземление упоминаний на ростер (@ник настоящий или обращение по имени — выдуманный
  # тег хуже отсутствующего).
  # 🔴 Никакой автономии (урок BOB-076): вне хода и на ходе НЕ-owner'а инструмент не
  # отправляет ничего. Предлагать Боб может, отправлять без «да» — нет. На автономном
  # тике отправка недоступна СТРУКТУРНО (capability помечена permission=confirm, а
  # автономная граница такие не исполняет), даже если внести её в goals.safe_capabilities.
  # 🔴 ЗАВИСИМОСТЬ ОТ coder.dev_dm: сам контур согласия owner'а (BOB-082.4) собирается
  # ТОЛЬКО за этим флагом. Без него спросить «выносить ли приватное» не у кого, и по
  # безопасному умолчанию перенос не делается — то есть при social.delivery ON и
  # coder.dev_dm OFF отправка обычных сообщений работает, а всё приватное из памяти
  # отклоняется наглухо (Боб предложит переспросить). Включайте эти два флага вместе:
  # главный сценарий эпика («попроси из лички») и так живёт в dev-канале лички.
  # Адреса берутся из секции telegram (чат + топик Боба, личка owner'а); если не настроен
  # ни один — инструмент не регистрируется вовсе. Выключено по умолчанию; OFF → манифест
  # без него, то есть ход байт-в-байт прежний.
  # delivery: true
  #
  # Ростер комнаты (BOB-080): Боб припоминает, кто в комнате появлялся недавно.
  # roster: true

embeddings:
  # Local semantic-memory embeddings (BOB-011). Runs against a LOCAL Ollama server
  # so memory content never leaves the machine (privacy). Provider-agnostic:
  # point base_url/model/dim at a different local model (e.g. qwen3-embedding)
  # without any consumer change. Defaults: BGE-M3 dense, 1024-dim, multilingual.
  base_url: http://localhost:11434   # local Ollama (env: BOB_EMBEDDINGS__BASE_URL)
  model: bge-m3                      # embedding model (env: BOB_EMBEDDINGS__MODEL)
  dim: 1024                          # vector dimension fixed by the model

telegram:
  # Two bots in one process (BOB-003): Bob lives in his topic; GUPPI is the
  # gatekeeper/admin in General. Tokens are env-only (see header) — never here.
  poll_timeout: 10
  # BOB-094: how many CONSECUTIVE poll failures we diagnose as «оглох» (a WARNING in
  # the log + a ./bob-status signal — NOT a Telegram alert: a deaf Bob cannot message
  # himself, that needs an external channel, done separately). > 1 so a routine
  # long-poll blip never raises a false alarm; the diagnosis + its recovery each log
  # exactly once (not per failure).
  outage_threshold: 5
  chat_id: 0                   # group chat id, e.g. -1001234567890 (placeholder)
  bob:
    # token: env BOB_TELEGRAM__TOKEN (not here)
    topic_id: 0                # Bob's forum topic (message_thread_id), e.g. 32
  # guppi.token: env GUPPI_TELEGRAM__TOKEN (not here) — no non-secret guppi keys yet
  # Authorization (Bob is private). Only the owner + allowlisted users, and only
  # inside allowed_chat_ids, may interact; everyone else is silently ignored.
  owner_id: 0                  # your Telegram user id (always authorized)
  allowed_chat_ids: []         # chat ids Bob will respond in, e.g. [-1001234567890]
  #                            # env: BOB_TELEGRAM__OWNER_ID, and a CSV string for
  #                            # BOB_TELEGRAM__ALLOWED_CHAT_IDS (e.g. "111,222").
  # Runtime allowlist grows via the owner command "/authorize <user_id>" and is
  # persisted in SQLite (kv), so grants survive a restart.

dialogue:
  # Intake coalescing window (BOB-072). When the holistic stream-read is on
  # (presence.stream_read), a chat's ambient burst is held this long — «пусть
  # допишут» — so Bob reads the whole settled burst at once instead of reacting
  # per message. A direct address (@Боб / reply-to-Bob / «Боб, …») ALWAYS flushes
  # the window immediately (INV-1). Ignored while presence.stream_read is off
  # (window 0 → byte-identical to the per-message path).
  intake_debounce_ms: 600

presence:
  # Holistic stream-read (BOB-072) master switch. OFF by default — the whole
  # «человеческое групповое присутствие» epic ships as one piece. On → a settled
  # ambient burst is read in ONE Tier-1 «read the room» pass and Bob decides, by
  # meaning, what each message deserves (a word / a like / silence); every ambient
  # message is still remembered (persist + floor). A direct address is answered
  # deterministically, above and outside the batch read (INV-1).
  stream_read: false

persistence:
  db_path: data/bob.db         # SQLite (WAL) — episodic/semantic memory + state
  soul_dir: data/soul          # Genesis-written soul artifacts (SOUL.md, JSON profiles)

genesis:
  templates_dir: bob-soul      # personality "genome" templates (repo-root default)

# Self-introspection — «Боб знает свой мир» (BOB-017 / BOB-067 / BOB-081). Read-only,
# privacy-guarded и conversation-only (never on the autonomous allowlist). ``enabled``
# defaults TRUE.
# 🔴 ИСПРАВЛЕНО ПО ФАКТУ (bob-a6b.17; правка видимая, а не переписанная задним числом).
# Здесь стояло «only src/tests/docs visible; SOUL/bob.db/.env/config DENIED» — инвариант
# ДО BOB-067, который сознательно (решение owner'а) открыл Бобу ВЕСЬ репозиторий: он
# инженер, а не турист по белому списку. Что на самом деле: `config/` и `data/` ЧИТАЮТСЯ;
# отказ — на выход за корень репозитория, на ключевой материал где угодно в дереве
# (`.secrets/`, `*.pem`/`*.key`/`*.p12`/`*.pfx`, `id_rsa`/`id_ed25519`) и на служебное
# `.git/**`; всё, что вернулось, проходит через гашение секрето-подобных ЗНАЧЕНИЙ
# (PEM, `ghs_`/`ghp_`/`github_pat_`, JWT, пароль в URL, `KEY=value`). То есть `.env`
# прочитается, но секрет из него наружу не уедет. Перечень живёт в ОДНОМ месте —
# `src/bob/capabilities/introspection/privacy_guard.py`.
introspection:
  enabled: true
  # 🔴 BOB-081 SUB-flag, default OFF. The read-only DEV tools — recent_commits (git
  # history), list_tasks / show_task / task_comments (tracker reads via ``bd``). OFF →
  # Bob never sees them (zero behaviour change). Flip to true after review + a negative
  # smoke (no secrets in git/bd output; no write-form is expressible).
  dev_tools: false
  # 🔴 BOB-091 SUB-flag, default OFF. The read-only ARCHITECTURE tools —
  # draw_architecture (the mermaid SOURCE of ``beadloom graph``: Боб объясняет схему
  # словами И отдаёт тот же источник в render_diagram, чтобы прислать картинку) и
  # architecture_impact («что сломается, если тронуть memory», ``beadloom why``, сжато) и
  # project_health (BOB-091.2 — ВЕСЬ остальной read-only beadloom одним инструментом над
  # закрытым перечнем отчётов: status / prime / doctor / sync-check / lint / diff).
  # Формы argv фиксированные, write-команды beadloom невыразимы (в т.ч. `prime --update`,
  # который перепишет AGENTS.md, и переиндексирующий плоский `lint`). OFF → Bob never sees
  # them. Flip to true after review + живой смоук (схема реально пришла картинкой).
  architecture_tools: false

# «Bob runs Claude Code» (BOB-039) — the gated coding assistant. Owner-only, the
# UNBYPASSABLE plan gate + kill-switch; Bob works in an ISOLATED git worktree and NEVER
# merges / pushes main. Default off (the most powerful capability).
coder:
  enabled: false               # /code <task> | approve | stop | status (owner-only)
  permission_mode: acceptEdits # claude mode on execution (inside the isolated worktree)
  timeout: 600                 # per-run ceiling, seconds
  # 🔴 SAFETY (BOB-076): auto-START a session from NATURAL chat (no explicit /code)?
  # Default OFF. A cheap Tier-0 misclassification of a casual owner reply once launched
  # a runaway coder from ordinary chat. OFF → the coder starts ONLY via an explicit
  # /code; natural approve/stop of an already-live session stay ON regardless.
  nl_autostart: false
  # Dev-channel LIVE-STREAM (BOB-082.3): stream the raw, UNCAPPED Claude Code events into
  # the owner's PRIVATE DM (a live "terminal") instead of the capped group narration. The
  # group topic then gets only a one-line pointer ("детали в личке") — the firehose never
  # floods the group (INV-5). Default OFF → behaviour unchanged (capped narration to the
  # group). dev_dm_chat_id defaults to telegram.owner_id (the owner's own 1:1 chat).
  # dev_dm: false
  # dev_dm_chat_id: 0
  # 🔴 INTERACTIVE terminal (BOB-083): a LIVE, bidirectional claude session in the owner's
  # PRIVATE DM — `/code -i <task>` (or `/interactive <task>`) opens it, the owner's plain DM
  # replies then go straight to claude's stdin (steer), and `stop` / `/exit` closes it. The
  # most powerful coding surface, so it is owner-only + DM-only + flag-gated and physically
  # cannot merge/push (edits stay in an isolated worktree; land via the normal PR gate,
  # INV-2 — but read what allow_bypass below really costs). Default OFF → the mode is
  # entirely unavailable (no entry, the gate never fires).
  # The DM target reuses dev_dm_chat_id (default telegram.owner_id).
  # interactive: false
  # 🔴 GUPPI CANON (BOB-087.A1 wiring, BOB-090.D core): who SPEAKS the mechanics. By canon
  # (Dennis E. Taylor) GUPPI is a non-sentient interface — no personality, no opinion, no
  # initiative — so the machine-sounding part is his to say, dryly, on HIS bot: the
  # per-event run narration, the technical run status and the raw claude stream. Bob's own
  # voice (берусь / план / готово-PR / провал / «продолжаю» / the DM pointer) always stays
  # on Bob's bot; a permission request is Bob's too — it is a social act, not mechanics.
  # WHICH message is which is decided by the pure core `bob.coding.speaker.speaker_for`,
  # not by the send site. Default OFF → everything stays on Bob's bot exactly as before
  # (byte-identical). ON needs telegram.guppi.token (env GUPPI_TELEGRAM__TOKEN) AND the
  # owner to have started GUPPI's bot, otherwise the DM firehose has nowhere to land.
  # stream_via_guppi: false
  # Where the isolated git worktrees are created (relative to the repo root). A fresh
  # worktree holds only TRACKED files, so Bob's private data (data/soul/, bob.db*, .env*,
  # config/*) never reaches Claude Code — that absence IS the isolation.
  # worktree_root: .worktrees
  # 🔴 SANDBOX RELAXATION (BOB-087.D2), owner-only, ships OFF. Admits
  # `--permission-mode bypassPermissions` into the runner's allowlist: claude stops asking
  # before each edit (fast) — and gets an UNSUPERVISED shell inside a LINKED worktree, which
  # shares the main repo's .git: the same refs, remotes and credentials. From there
  # `git push --force origin HEAD:main` / `gh pr merge` ARE expressible. Bob's own code adds
  # no push/merge path, but with this flag ON «main is untouchable» stops being a STRUCTURAL
  # guarantee and becomes your judgement. OFF → the allowlist is exactly {plan, acceptEdits}.
  # allow_bypass: false
  # 🔴 SANDBOX RELAXATION (BOB-087.D2), ships EMPTY. Extra `--add-dir` paths handed to
  # claude, i.e. directories OUTSIDE the worktree (and outside the tracked-files-only copy
  # that keeps Bob's private data away). Empty → no --add-dir at all, argv byte-identical.
  # extra_dirs: []
  # 🔴 LONG-LIVED workspace + session RESUME (BOB-087.D3), owner-only + DM-only, ships OFF.
  # `/workspace <name> [task]` (or `/code -w`) opens a PERSISTENT worktree where work
  # ACCUMULATES between sessions; `/resume <workspace>` (`/code -r`) raises the previous
  # session there via `claude --resume <id>` — «pick our epic session up from the phone».
  # Raising a live claude into an already-accumulated tree is the strongest interactive
  # action, so (BOB-076 lesson) it is deliberate: raising also needs an explicit «да» inside
  # a TTL window, and only a STOPPED session can be raised (never a live attach).
  # OFF → neither command is recognised, no persistent worktree is created, behaviour is
  # byte-identical to BOB-083.
  # resume: false
  # 🔴 СТАРТОВЫЙ ПРОМПТ КОНВЕЙЕРА (BOB-088, срез 2), ships OFF. Сессия начинается с
